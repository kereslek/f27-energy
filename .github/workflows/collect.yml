name: Adatgyűjtés

# 30 percenként EGY rövid kör, utána a futás véget ér (CLAUDE.md 20. fejezet: a GitHub Actions itt csak
# építésre, tesztre, telepítésre való; ütemezett munka legfeljebb 30 percenként, 10 percen belül, ciklus és
# önmagát újraindító futás nélkül). Egy kör: Tuya állapotok -> Supabase (device_status, energy_daily), az F27
# és (ha be van állítva) az O2B saját Supabase-projektjébe; óránként egyszer időjárás és foglaltság (az adatbázis
# alapján dönt, nem futásonként); riasztások kiértékelése (csak jelez, nem kapcsol); O2B robotok: a dashboard
# függő parancsai (legfeljebb kb. 30 perc késéssel), utána állapot.
# A GitHub cronja kihagyhat futásokat: ezt elfogadjuk, nem pótoljuk láncolt vagy külső indítással.
# A log publikus: csak darabszámok kerülnek bele, név, azonosító vagy érték nem.
#
# Szüneteltetés: Actions > Adatgyűjtés > "..." > Disable workflow. Kézi indítás: Actions > Adatgyűjtés > Run workflow.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Robotporszívó-könyvtárak (O2B; ha nem sikerül, a gyűjtés enélkül megy)
        continue-on-error: true
        run: pip install -q python-roborock vacuum-map-parser-dreame
      - name: Adatgyűjtés (egy kör)
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_ENDPOINT: ${{ secrets.TUYA_ENDPOINT }}
          TUYA_UID: ${{ secrets.TUYA_UID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          # Riasztások (docs/riasztasok.md): push (ntfy), e-mail (SMTP), WhatsApp (CallMeBot, nem kötelező)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # Második telephely (O2B, sites/o2b): saját Supabase-projekt; amíg nincs beállítva, kimarad.
          O2B_SUPABASE_URL: ${{ vars.O2B_SUPABASE_URL || secrets.O2B_SUPABASE_URL }}
          O2B_SUPABASE_SECRET_KEY: ${{ secrets.O2B_SUPABASE_SECRET_KEY }}
        run: |
          python -m f27.collect || echo "::warning::Az F27 köre hibával zárult, a következő ütemezett futás újra próbálja."
          if [ -n "$O2B_SUPABASE_URL" ] && [ -n "$O2B_SUPABASE_SECRET_KEY" ]; then
            echo "--- O2B ---"
            F27_SITE_CONFIG=sites/o2b/site.json F27_STATE_FILE=/tmp/o2b-collect-state.json \
            SUPABASE_URL="$O2B_SUPABASE_URL" SUPABASE_SECRET_KEY="$O2B_SUPABASE_SECRET_KEY" \
            AIRBNB_ICAL_URL= BOOKING_ICAL_URL= \
              python -m f27.collect || echo "::warning::Az O2B köre hibával zárult."
            # robotporszívók (R1 Dreame lent, R2 Roborock fent): előbb a dashboard függő parancsai, utána az állapot
            F27_SITE_CONFIG=sites/o2b/site.json SUPABASE_URL="$O2B_SUPABASE_URL" SUPABASE_SECRET_KEY="$O2B_SUPABASE_SECRET_KEY" \
              timeout 120 python -m f27.robots queue || echo "::warning::A robot-parancsok végrehajtása hibával zárult."
            F27_SITE_CONFIG=sites/o2b/site.json SUPABASE_URL="$O2B_SUPABASE_URL" SUPABASE_SECRET_KEY="$O2B_SUPABASE_SECRET_KEY" \
              timeout 150 python -m f27.robots status || echo "::warning::A robotok lekérése hibával zárult."
          fi
