name: Adatgyűjtés

# 10 percenként: Tuya állapotok -> Supabase (device_status, energy_daily).
# Óránként egyszer: időjárás (Open-Meteo) és foglaltság (Airbnb naptárexport, ha be van állítva).
# Minden körben: riasztások kiértékelése és értesítés (ntfy push, e-mail), csak jelez, nem kapcsol.
# Körönként szokásosan 2 Tuya API-hívás (token + eszközlista).
# A log publikus: csak darabszámok kerülnek bele, név, azonosító vagy érték nem.
#
# Ütemezés: a GitHub cron-időzítője nem megbízható (2026.11.08-án órákig egyszer sem indult el),
# ezért egy futás kb. 1 órán át 10 percenként gyűjt, a végén pedig maga indítja a következő
# futást (workflow_dispatch). A cron csak tartalék: ha a lánc valamiért megszakad, újraindítja.
# Egyszerre legfeljebb egy futás megy (concurrency), a többi sorba áll.
#
# Szüneteltetés: Actions > Adatgyűjtés > "..." > Disable workflow (ez a láncot is megállítja).
# Kézi indítás: Actions > Adatgyűjtés > Run workflow.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # a következő futás elindításához

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adatgyűjtés (10 percenként, kb. 1 órán át)
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_ENDPOINT: ${{ secrets.TUYA_ENDPOINT }}
          TUYA_UID: ${{ secrets.TUYA_UID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          # Riasztások (docs/riasztasok.md): push (ntfy), e-mail (SMTP), WhatsApp (CallMeBot, nem kötelező)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          end=$(( $(date +%s) + 55 * 60 ))
          n=0
          while :; do
            n=$((n + 1))
            echo "::group::$n. kör"
            python -m f27.collect || echo "::warning::A(z) $n. kör hibával zárult, a következő 10 perc múlva jön."
            echo "::endgroup::"
            [ $(( $(date +%s) + 600 )) -lt "$end" ] || break
            sleep 600
          done
          echo "Körök ebben a futásban: $n"
      - name: Következő futás indítása
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
