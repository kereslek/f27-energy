name: Adatgyűjtés

# 10 percenként: Tuya állapotok -> Supabase (device_status, energy_daily).
# Futásonként szokásosan 2 Tuya API-hívás (token + eszközlista).
# A log publikus: csak darabszámok kerülnek bele, név, azonosító vagy érték nem.
# Szüneteltetés: Actions > Adatgyűjtés > "..." > Disable workflow.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adatgyűjtés
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_ENDPOINT: ${{ secrets.TUYA_ENDPOINT }}
          TUYA_UID: ${{ secrets.TUYA_UID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m f27.collect
