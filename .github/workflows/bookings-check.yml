name: Foglaltság-ellenőrzés (F27)

# Kézzel indítható. A Supabase bookings táblájából (az Airbnb-naptár exportja; a Booking-naptár
# szinkronban van vele) kiszámolja, hogy ma és holnap éjjel van-e vendég, és mikortól foglalható
# újra. Az eredmény pushban (ntfy) és e-mailben megy a tulajnak (az e-mailben a következő 60 nap eseményeivel); a publikus logba csak az kerül, hogy elment-e,
# és ha megadsz egy dátumot, egyezik-e a várt "legkorábban ekkor foglalható" nappal.

on:
  workflow_dispatch:
    inputs:
      varhato:
        description: "Várt legkorábbi foglalható nap (ÉÉÉÉ-HH-NN), nem kötelező"
        required: false
        default: ""
      harmas:
        description: "Hármas ellenőrzés egy időszakra: 'ÉÉÉÉ-HH-NN ÉÉÉÉ-HH-NN' (első nap, az utolsó utáni nap); üresen a sima ellenőrzés"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ellenőrzés
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          VARHATO: ${{ inputs.varhato }}
          HARMAS: ${{ inputs.harmas }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: |
          if [ -n "$HARMAS" ]; then python -m f27.bookings harmas $HARMAS; else python -m f27.bookings check $VARHATO; fi | tee -a "$GITHUB_STEP_SUMMARY"
