name: Térkép (Pages)

# A web/ mappát, a config/devices.json-t és a TITKOSÍTOTT data/*.enc
# fájlokat publikálja GitHub Pages-re. A böngészőben jelszóval nyílik.

on:
  push:
    paths: ["web/**", "config/**", "data/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Eszközfelderítés"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages csak az alapértelmezett ágról telepíthet.
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Oldal összeállítása
        env:
          # Nyilvános értékek (GitHub Variables). A secret kulcs ide SOHA nem kerül.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # O2B (második telephely, /o2b/): saját Supabase-projekt, szintén csak a publishable kulcs.
          O2B_SUPABASE_URL: ${{ vars.O2B_SUPABASE_URL || secrets.O2B_SUPABASE_URL }}
          O2B_SUPABASE_PUBLISHABLE_KEY: ${{ vars.O2B_SUPABASE_PUBLISHABLE_KEY || secrets.O2B_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site/data _site/config
          cp -r web/. _site/
          rm -f _site/config.example.js
          cp config/devices.json _site/config/
          cp data/*.enc _site/data/ 2>/dev/null || true
          python3 - <<'PY'
          import json, os
          import base64
          def secretish(key):
              role = ""
              if key.startswith("eyJ") and key.count(".") == 2:   # régi (JWT) kulcs: a szerepkör a tartalmában
                  part = key.split(".")[1]
                  try:
                      role = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))).get("role", "")
                  except Exception:
                      role = ""
              return key.startswith("sb_secret_") or role == "service_role"
          for path, url_var, key_var in (("_site/config.js", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY"),
                                         ("_site/o2b/config.js", "O2B_SUPABASE_URL", "O2B_SUPABASE_PUBLISHABLE_KEY")):
              cfg = {"supabaseUrl": os.environ.get(url_var, "").strip(), "supabaseKey": os.environ.get(key_var, "").strip()}
              if secretish(cfg["supabaseKey"]):
                  raise SystemExit(f"HIBA: a {key_var} helyén secret kulcs van. Csak a publishable (anon) kulcs mehet az oldalba.")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write("window.F27_CONFIG = " + json.dumps(cfg) + ";\n")
              print(path, "kész, Supabase beállítva:", bool(cfg["supabaseUrl"] and cfg["supabaseKey"]))
          PY
          # Gyorsítótár-törés: a szkriptek URL-je a commit rövid azonosítóját kapja (?v=...), így a
          # telefon böngészője minden telepítés után az új JS-t tölti be, nem a régit.
          V="${GITHUB_SHA::8}"
          for f in _site/index.html _site/alaprajz.html _site/o2b/index.html; do
            [ -f "$f" ] && sed -i -E "s#<script src=\"((\.\./)?js/[^\"?]+\.js|o2b-[a-z]+\.js|motion\.js|robotview\.js|config\.js|\.\./vendor/supabase\.js)\"#<script src=\"\1?v=$V\"#g" "$f"
            [ -f "$f" ] && sed -i "s#<meta name=\"app-version\" content=\"dev\">#<meta name=\"app-version\" content=\"$V\">#" "$f"
          done
          echo "$V" > _site/version.txt; echo "$V" > _site/o2b/version.txt
          # Porszívó-szem (iframe): a modulok is új címet kapnak
          sed -i "s#src=\"pov.js\"#src=\"pov.js?v=$V\"#" _site/o2b/pov/index.html
          sed -i "s#import('./scene.js')#import('./scene.js?v=$V')#" _site/o2b/pov/pov.js
          sed -i "s#from './scene-up.js'#from './scene-up.js?v=$V'#" _site/o2b/pov/scene.js
          grep -c "?v=$V" _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
