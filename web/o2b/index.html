<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3fae6a">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>O2B Energy Quest</title>
<meta name="description" content="O2B Energy Quest: a kétszintes lakás izometrikus babaháza bútorokkal, élő eszközökkel és Pamutkával, a tanácsadó macskával.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Baloo+2:wght@800&amp;family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
:root{--ink:#1e2a44;--thermo:#2f6fe4;--ac:#26a5c9;--plug:#ff8a3d;--boil:#c0399f;--pir:#7a6fb0;--off:#8a8f9c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1e2a44;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none}
#app{position:absolute;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#sky,#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{touch-action:none;cursor:grab}
#world.panning{cursor:grabbing}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes legA{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-30px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes advpop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}
.cloud{animation:drift 24s ease-in-out infinite alternate}
.cloud2{animation:drift 31s ease-in-out infinite alternate-reverse}
.tw{animation:tw 3.4s ease-in-out infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}

/* bútorok és falak (a F27 szerint) */
.pc{cursor:pointer}
.pc:hover{filter:brightness(1.06) drop-shadow(0 0 3px #ffffff)}
#app.editing .pc.mv{cursor:grab}
#app.editing .pc.mv:hover{filter:drop-shadow(0 0 3px #ffe066)}
.pc.sel{filter:drop-shadow(0 0 4px #ff4fa3) drop-shadow(0 0 2px #ff4fa3)}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 14px 6px rgba(30,42,68,.45)) brightness(1.08)}
.wall{pointer-events:none}
.rlabel{font-family:"Lilita One","Baloo 2",sans-serif;font-size:15px;fill:#fff7e6;stroke:#1e2a44;stroke-width:3.4px;paint-order:stroke;pointer-events:none;letter-spacing:.6px}
.lvlab{font-family:"Lilita One","Baloo 2",sans-serif;font-size:28px;fill:#ffe066;stroke:#1e2a44;stroke-width:5px;paint-order:stroke;pointer-events:none;letter-spacing:1px}
.slab-t{font-family:"Lilita One","Baloo 2",sans-serif;font-size:14px;fill:#fff7e6;stroke:#1e2a44;stroke-width:3px;paint-order:stroke;letter-spacing:1px}
.mark{font-family:"Nunito",sans-serif;font-weight:900;font-size:11px;fill:#1e2a44;pointer-events:none}
.street{cursor:default}
.street.can{cursor:pointer}

/* tűk (SVG) */
.pin{cursor:pointer;outline:none}
.pin .dot{stroke:#1e2a44;stroke-width:3}
.pin .ring{fill:none;stroke:#ff5a3c;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
.pin text{font-family:"Lilita One","Baloo 2",sans-serif;pointer-events:none}
.pin:hover .dot,.pin:focus .dot{stroke:#ffe066}
.pin.sel .dot{stroke:#ff4fa3;stroke-width:4}
.pin .vbg{stroke:#1e2a44;stroke-width:2}
.pin .vt{font-family:"Nunito",sans-serif;font-weight:900;font-size:12px}

/* Pamutka */
#cat{cursor:pointer}
#app.editing #cat{pointer-events:none;opacity:.55}
#cat .body{animation:bob .42s ease-in-out infinite}
#cat.walk .lA{animation:legA .42s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
#cat.walk .lB{animation:legB .42s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
#cat .tail{animation:tail 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
#cat .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
#cat .pose{display:none}
#cat.walk .p-walk,#cat.sit .p-sit,#cat.sleep .p-sleep{display:inline}
#cat.sit .body,#cat.sleep .body{animation:none}
#cat .zz{animation:zz 2.4s ease-out infinite}
#cat .zz.b{animation-delay:1.2s}
#cat .alert{display:none}
#cat.has-tip .alert{display:inline}
#cat.has-tip .alert g{animation:hop .7s ease-in-out infinite}

/* felső sáv: csempék */
#top{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
#chips{display:flex;gap:10px;flex-wrap:wrap;pointer-events:auto;min-width:0}
.brand{display:flex;flex-direction:column;justify-content:center;padding:4px 14px 6px;border-radius:16px;background:#3fae6a;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;color:#fff7e6}
.brand b{font-family:"Lilita One","Baloo 2",sans-serif;font-weight:400;font-size:22px;letter-spacing:1px;line-height:1.1;text-shadow:0 2px 0 #1e2a44}
.brand small{font-size:10.5px;font-weight:900;letter-spacing:1px}
.chip{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;min-width:96px}
.chip[hidden]{display:none}
.ck{font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:#45507a;white-space:nowrap}
.cv{font-family:"Lilita One","Baloo 2",sans-serif;font-size:23px;line-height:1.05;color:#1e2a44;white-space:nowrap}
.cs{font-size:10.5px;font-weight:800;color:#6b7280;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip.warn{background:#fff3c9}
.chip.hot{background:#ffd9cc}
.chip.hot .cv{color:#b02a17}
#acts{margin-left:auto;display:flex;gap:10px;pointer-events:auto;flex:0 0 auto}

/* gombok */
.btn{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:3px solid #1e2a44;background:#ffffff;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;font-weight:900;font-size:13px;color:#1e2a44}
.btn:hover{background:#fff1c9}
.btn:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}
.btn.ib{width:44px;padding:0}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:12px;box-shadow:0 3px 0 #1e2a44}
.btn.ib.sm{width:36px;padding:0;font-size:17px}
.btn.primary{background:#ffe066}
.btn.on{background:#2f6fe4;color:#ffffff}

/* alsó eszköztár */
#tools{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;z-index:5;max-width:calc(100% - 480px)}
.vopill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:2.5px solid #1e2a44;background:#7a6fb0;color:#fff;font:900 11.5px/1 "Nunito",sans-serif;letter-spacing:.6px;box-shadow:0 2px 0 #1e2a44}
.vopill[hidden]{display:none}
.savest{font:900 11px "Nunito",sans-serif;color:#fff7e6;text-shadow:0 1px 0 #1e2a44}
select.lay{height:36px;border-radius:12px;border:3px solid #1e2a44;background:#fff;font:900 12.5px "Nunito",sans-serif;color:#1e2a44;padding:0 8px;box-shadow:0 3px 0 #1e2a44;max-width:200px}
select.lay[hidden]{display:none}

/* Pamutka kártya */
#pam{position:absolute;left:12px;bottom:12px;width:450px;max-width:calc(100% - 24px);z-index:5;padding:10px 12px 12px;border-radius:22px;background:#fbf1dc;border:4px solid #1e2a44;box-shadow:0 6px 0 #1e2a44}
.ip-head{display:flex;align-items:center;gap:10px;padding-right:40px}
.ip-char{flex:0 0 auto;width:58px;height:58px;border-radius:16px;background:#bfe6ff;border:3px solid #1e2a44;overflow:hidden}
.ip-char svg{display:block;width:100%;height:100%}
.ip-title{font-family:"Fraunces",serif;font-weight:800;font-size:23px;color:#3b2a14;line-height:1.05}
.ip-sub{font-size:11.5px;font-weight:900;color:#7a5a2e}
.src{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;border:2px solid #1e2a44;margin-left:4px}
.src[hidden]{display:none}
.src.live{background:#3fae6a;color:#fff}.src.demo{background:#ffe066;color:#1e2a44}
#say{margin-top:8px;padding:8px 10px;border-radius:14px;border:2.5px solid #1e2a44;background:#fffdf7;box-shadow:0 3px 0 #1e2a44;font:800 13px/1.35 "Nunito",sans-serif;max-height:190px;overflow-y:auto;user-select:text;-webkit-user-select:text}
#say ul{margin:4px 0 0;padding-left:18px}
#say li{margin:2px 0}
#say small{color:#6b7280}
#say a{color:#2f6fe4;cursor:pointer;text-decoration:underline}
#pam .min{position:absolute;right:10px;top:8px}
#pam.mini #say,#pam.mini .ip-sub{display:none}
#pam.mini{width:auto}

/* kijelölt tárgy */
#info{position:absolute;right:12px;top:96px;z-index:5;max-width:330px;padding:10px 12px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;font:800 13px/1.35 "Nunito",sans-serif}
#info b{font-family:"Lilita One","Baloo 2",sans-serif;font-weight:400;font-size:17px;letter-spacing:.3px}
#info[hidden]{display:none}

/* Eszközök fiók és belépés */
.sheet{position:absolute;right:12px;top:96px;bottom:70px;width:380px;max-width:calc(100% - 24px);z-index:6;display:flex;flex-direction:column;padding:12px;border-radius:22px;background:#fbf1dc;border:4px solid #1e2a44;box-shadow:0 6px 0 #1e2a44}
.sheet[hidden]{display:none}
.sheet h2{margin:0 0 8px;font-family:"Lilita One","Baloo 2",sans-serif;font-weight:400;font-size:21px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
#rooms{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px;overscroll-behavior:contain}
.room h3{margin:0 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7a5a2e}
.dv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin-bottom:4px;border-radius:12px;border:2px solid #1e2a44;background:#fffdf7;font:800 12.5px "Nunito",sans-serif}
.dv:hover{background:#fff1c9}.dv:focus-visible{outline:3px solid #ff4fa3}
.dv .sw{width:12px;height:12px;border-radius:50%;border:2px solid #1e2a44;flex:0 0 auto}
.dv .n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv .s{font-weight:900;white-space:nowrap}
.dv.hot .s{color:#c43f1f}.dv.cold .s{color:#2f6fe4}.dv.off{opacity:.62}.dv.on .s{color:#2f8a3a}
.dv.sel{background:#ffe066}
#logincard{position:absolute;right:12px;top:96px;z-index:7;width:330px;padding:14px;border-radius:20px;background:#fbf1dc;border:4px solid #1e2a44;box-shadow:0 6px 0 #1e2a44}
#logincard[hidden]{display:none}
#logincard label{display:block;font-size:12px;font-weight:900;margin:6px 0 2px}
#logincard input{width:100%;height:40px;border-radius:12px;border:3px solid #1e2a44;padding:0 10px;font:800 14px "Nunito",sans-serif}
#lerr{color:#c43f1f;font-weight:900;font-size:12px;min-height:16px;margin-top:6px}
#who{font-size:12px;font-weight:900;margin-top:8px;color:#45507a}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:14px;border:3px solid #1e2a44;background:#1e2a44;color:#fff7e6;font:900 13px "Nunito",sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#toast[hidden]{display:none}
#toast.ok{background:#3fae6a}#toast.err{background:#e8432f}

/* telefon */
@media (max-width: 760px){
  #top{left:8px;right:8px;top:8px;gap:6px}
  #chips{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .brand b{font-size:17px}.brand{padding:2px 10px 4px}
  .chip{min-width:84px;padding:4px 9px;border-radius:13px}
  .cv{font-size:18px}.ck{font-size:9.5px}.cs{font-size:9.5px;max-width:150px}
  #acts{gap:6px}#acts .lbl{display:none}#acts .btn{min-height:40px;padding:0 10px}
  #pam{left:8px;right:8px;bottom:58px;width:auto;padding:8px 10px}
  #say{max-height:96px;font-size:12px}
  .ip-char{width:44px;height:44px}.ip-title{font-size:19px}
  #tools{left:8px;right:8px;bottom:8px;max-width:none;justify-content:center;gap:5px}
  #tools .lbl{display:none}
  #b-zin,#b-zout,#savest{display:none}
  #tools .btn.ib.sm{width:34px}
  .sheet,#logincard,#info{left:8px;right:8px;width:auto;max-width:none;top:auto;bottom:58px;max-height:72%}
  .sheet{height:72%}
}
</style>
</head>
<body>
<div id="app">
  <svg id="sky" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <svg id="world" role="img" aria-label="Az O2B lakás izometrikus babaháza: lent az alsó szint, fölötte lebegve a felső. A bútorok Szerkesztés módban húzhatók."></svg>

  <div id="top">
    <div id="chips">
      <div class="brand" title="O2B Energy Quest"><b>O2B</b><small>ENERGY QUEST</small></div>
      <div class="chip" id="c-out" title="Kinti hőmérséklet"><span class="ck">KINT</span><span class="cv">--</span><span class="cs"></span></div>
      <div class="chip" id="c-in"><span class="ck">BENT ÁTLAG</span><span class="cv">--</span><span class="cs"></span></div>
      <div class="chip" id="c-pow"><span class="ck">FOGYASZTÁS MOST</span><span class="cv">--</span><span class="cs"></span></div>
      <div class="chip" id="c-mot"><span class="ck">UTOLSÓ MOZGÁS</span><span class="cv">--</span><span class="cs"></span></div>
      <div class="chip" id="c-sun"><span class="ck">NAP</span><span class="cv">--</span><span class="cs"></span></div>
      <div class="chip" id="c-bat" hidden><span class="ck">ELEMCSERE</span><span class="cv"></span><span class="cs"></span></div>
    </div>
    <div id="acts">
      <button class="btn" id="b-dev" type="button" aria-expanded="false" aria-controls="devsheet" title="Eszközök szobánként"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6v6H5zM13 4h6v6h-6zM5 14h6v6H5zM16 14v6M13 17h6" fill="none" stroke="#1e2a44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl" id="dh">Eszközök</span></button>
      <button class="btn" id="b-login" type="button" aria-controls="logincard">Belépés</button>
    </div>
  </div>

  <div id="pam" aria-live="polite">
    <button class="btn ib sm min" id="b-pmin" type="button" aria-label="Pamutka kártya kicsinyítése" title="Kicsinyítés">−</button>
    <div class="ip-head">
      <div class="ip-char" aria-hidden="true"><svg viewBox="-42 -56 84 80"><use href="#cat-face"/></svg></div>
      <div><div class="ip-title">Pamutka</div><div class="ip-sub">a tanácsadó macska <span class="src demo" id="demo">DEMÓ</span><span class="src live" id="livepill" hidden>ÉLŐ</span></div></div>
    </div>
    <div id="say">Miaú!</div>
  </div>

  <div id="info" hidden></div>

  <div id="tools">
    <span class="vopill" id="viewonly" hidden title="Belépve csak a tulajdonos szerkeszthet">CSAK MEGTEKINTÉS</span>
    <span class="savest" id="savest"></span>
    <select class="lay" id="layouts" hidden aria-label="Mentett elrendezések"></select>
    <button class="btn sm" id="b-save" type="button" hidden>Mentés</button>
    <button class="btn sm" id="b-saveas" type="button" hidden>Mentés másként</button>
    <button class="btn sm" id="b-def" type="button" hidden title="A kiválasztott elrendezés legyen az alapértelmezett">Alapértelmezett</button>
    <button class="btn sm" id="b-edit" type="button" aria-pressed="false" title="Szerkesztés: a bútorok húzhatók"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><span class="lbl">Szerkesztés</span></button>
    <button class="btn ib sm" id="b-undo" type="button" aria-label="Visszavonás (Ctrl+Z)" title="Visszavonás (Ctrl+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="#1e2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn ib sm" id="b-redo" type="button" aria-label="Újra (Ctrl+Y)" title="Újra (Ctrl+Y)" disabled><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="#1e2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn ib sm" id="b-reset" type="button" aria-label="Bútorok alaphelyzetbe" title="Bútorok alaphelyzetbe"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5" fill="none" stroke="#1e2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn ib sm" id="b-rotl" type="button" aria-label="Forgatás balra (Shift+R)" title="Forgatás balra (Shift+R)">⟲</button>
    <button class="btn ib sm" id="b-rotr" type="button" aria-label="Forgatás jobbra (R)" title="Forgatás jobbra (R)">⟳</button>
    <button class="btn ib sm" id="b-zin" type="button" aria-label="Nagyítás" title="Nagyítás">+</button>
    <button class="btn ib sm" id="b-zout" type="button" aria-label="Kicsinyítés" title="Kicsinyítés">−</button>
    <button class="btn ib sm" id="b-fit" type="button" aria-label="Teljes nézet" title="Teljes nézet"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#1e2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="sheet" id="devsheet" hidden role="dialog" aria-label="Eszközök szobánként">
    <h2>Eszközök <button class="btn ib sm x" id="b-devx" type="button" aria-label="Bezárás">✕</button></h2>
    <div id="rooms"></div>
  </div>

  <div id="logincard" hidden role="dialog" aria-label="Belépés">
    <form id="loginform">
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Jelszó</label><input id="pw" type="password" autocomplete="current-password" required>
      <div id="lerr" role="alert"></div>
      <button class="btn primary" type="submit" style="width:100%;margin-top:4px">Belépés</button>
    </form>
    <div id="who">Nem vagy belépve</div>
  </div>
  <div id="toast" hidden role="status"></div>
</div>

<!-- Pamutka arca: ezüst cirmos macska, sárgászöld szem, fekete nyakörv sárga medállal -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="cat-face">
