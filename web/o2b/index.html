<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O2B Energy</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* O2B első változat: fejléc-csempék, két szint izometrikus alaprajza élő tűkkel, mellette Pamutka
   és az eszközlista szobánként. Ugyanaz a hangulat, mint az F27 térképé (meleg dioráma, sötét ég). */
:root{
  --sky:#1b2440; --sky2:#26335a; --panel:#fffaf0; --ink:#1e2a44; --muted:#5b6585; --line:#e6dcc6;
  --oak:#d9ab6b; --oak2:#b98a4c; --lam:#e4d9c3; --lam2:#c9b99a; --tile:#d9dcd8; --tile2:#b9beb8; --balc:#a9c39a;
  --wallA:#f6f1e6; --wallB:#e3dccb; --gas:#e2572b; --ac:#2a8fb8; --plug:#2f9a52; --thermo:#c47f22; --boil:#8a4fb0;
  --off:#9a9486; --pir:#d94f9a; --ok:#2f7d4f; --warn:#b7791f; --hot:#c8321f;
  --f-head:"Baloo 2","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--sky2),var(--sky));color:var(--ink);font-family:var(--f-body);min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.brand{background:#ff4fa3;color:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 #b8226f;display:grid;align-content:center}
.brand b{font-family:var(--f-head);font-size:22px;line-height:1}
.brand span{font-size:11.5px;font-weight:900;letter-spacing:.5px;opacity:.95}
.chip{background:var(--panel);border:2px solid #1e2a44;border-radius:12px;box-shadow:0 4px 0 #1e2a44;padding:5px 12px;display:grid;gap:1px;min-width:112px}
.chip .ck{font-size:10.5px;font-weight:900;letter-spacing:.8px;color:var(--muted)}
.chip .cv{font-family:var(--f-head);font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap}
.chip .cs{font-size:10.5px;font-weight:900;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.chip.warn{background:#fff4d1;border-color:#b7791f;box-shadow:0 4px 0 #b7791f}.chip.warn .cv,.chip.warn .ck{color:#8a5a00}
.chip.hot{background:#ffe1d6;border-color:#c8321f;box-shadow:0 4px 0 #c8321f}.chip.hot .cv,.chip.hot .ck{color:#c8321f}
.grow{flex:1 1 auto}
.acct{background:#fff3c4;border:2px solid #1e2a44;border-radius:12px;box-shadow:0 4px 0 #1e2a44;padding:6px 12px;display:flex;gap:8px;align-items:center;font-weight:900;font-size:13px}
.acct button,.btn{font:inherit;font-weight:900;border:2px solid #1e2a44;border-radius:10px;background:#fff;padding:5px 10px;cursor:pointer;box-shadow:0 3px 0 #1e2a44}
.acct button:focus-visible,.btn:focus-visible,.lv button:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.demo{background:#ffe066;border:2px solid #1e2a44;border-radius:10px;padding:4px 10px;font-weight:900;font-size:12px;align-self:center}
.main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(#2a3866,#1f2a4d);border-radius:18px;padding:10px;position:relative;min-width:0;border:2px solid #0f1630}
.lv{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2}
.lv button{font:inherit;font-weight:900;font-size:13px;border:2px solid #1e2a44;border-radius:10px;background:#fff;padding:5px 10px;cursor:pointer;box-shadow:0 3px 0 #1e2a44}
.lv button[aria-pressed="true"]{background:#ff4fa3;color:#fff}
svg.plan{width:100%;height:auto;display:block}
svg text{font-family:var(--f-body)}
.pin{cursor:pointer}.pin .bub{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.pin.sel .ring{stroke:#ff4fa3;stroke-width:3}
.side{display:grid;gap:12px;min-width:0}
.card{background:var(--panel);border:2px solid #1e2a44;border-radius:16px;box-shadow:0 5px 0 #1e2a44;padding:12px 14px}
.card h2{font-family:var(--f-head);font-size:19px;margin:0 0 6px}
.cat{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start}
.cat svg{width:86px;height:86px}
.say{background:#fff;border:2px solid #1e2a44;border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.45;position:relative}
.say:before{content:"";position:absolute;left:-9px;top:18px;border:8px solid transparent;border-right-color:#1e2a44;border-left:0}
.say ul{margin:4px 0 0;padding-left:18px}.say li{margin:2px 0}
.rooms{display:grid;gap:8px}
.room h3{margin:0 0 3px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.dev{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;padding:3px 6px;border-radius:8px;cursor:pointer}
.dev:hover,.dev.sel{background:#fff0c9}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #1e2a44}
.val{font-family:var(--f-mono);font-size:12.5px;font-weight:700;white-space:nowrap}
.val.off{color:var(--off)}.val.hot{color:var(--hot)}.val.cold{color:#2a6fb8}.val.on{color:var(--plug)}
.foot{color:#c9d2ee;font-size:12px;text-align:center}
.login{display:grid;gap:6px;margin-top:6px}
.login input{font:inherit;padding:6px 8px;border:2px solid #1e2a44;border-radius:8px}
.err{color:var(--hot);font-weight:800;font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.tail{transform-origin:62px 66px;animation:tail 3.2s ease-in-out infinite}@keyframes tail{50%{transform:rotate(-12deg)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><b>O2B ENERGY</b><span id="sub">otthon · Pamutka vigyáz rá</span></div>
    <div class="chip" id="c-out"><span class="ck">KINT</span><span class="cv">--</span><span class="cs">XI. kerület</span></div>
    <div class="chip" id="c-in"><span class="ck">BENT ÁTLAG</span><span class="cv">--</span><span class="cs">cél: 22 °C nappal</span></div>
    <div class="chip" id="c-pow"><span class="ck">FOGYASZTÁS MOST</span><span class="cv">--</span><span class="cs">mért konnektorok</span></div>
    <div class="chip" id="c-mot"><span class="ck">UTOLSÓ MOZGÁS</span><span class="cv">--</span><span class="cs">lépcső teteje</span></div>

    <div class="acct" id="acct"><span id="who">Nem vagy belépve</span><button type="button" id="b-login">Belépés</button></div>
  </div>
  <div class="main">
    <div class="stage">
      <div class="lv" role="group" aria-label="Szint">
        <button type="button" id="l-lo" aria-pressed="true">Lent</button>
        <button type="button" id="l-up" aria-pressed="false">Fent</button>
      </div>
      <svg class="plan" id="plan" role="img" aria-label="Az O2B alaprajza élő értékekkel"></svg>
    </div>
    <div class="side">
      <div class="card">
        <h2>Pamutka mondja</h2>
        <div class="cat">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="92" rx="30" ry="5" fill="rgba(30,42,68,.18)"/>
            <path class="tail" d="M70 80 C 92 78, 96 58, 84 50 C 80 48, 77 52, 82 56 C 88 62, 84 72, 68 74 Z" fill="#b9bec6" stroke="#1e2a44" stroke-width="2.5"/>
            <path d="M28 88 C 22 60, 30 46, 50 46 C 70 46, 78 60, 72 88 Z" fill="#cfd3d9" stroke="#1e2a44" stroke-width="2.5"/>
            <path d="M36 60 q 14 -6 28 0 M33 70 q 17 -6 34 0 M32 80 q 18 -6 36 0" fill="none" stroke="#5b6270" stroke-width="3" stroke-linecap="round"/>
            <path d="M30 34 L 26 12 L 42 24 Z M70 34 L 74 12 L 58 24 Z" fill="#cfd3d9" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="50" cy="36" r="20" fill="#d9dce1" stroke="#1e2a44" stroke-width="2.5"/>
            <path d="M40 20 l 3 8 M50 18 v 9 M60 20 l -3 8" stroke="#5b6270" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="42" cy="36" rx="4" ry="5" fill="#b9c84a" stroke="#1e2a44" stroke-width="1.6"/><ellipse cx="58" cy="36" rx="4" ry="5" fill="#b9c84a" stroke="#1e2a44" stroke-width="1.6"/>
            <ellipse cx="42" cy="37" rx="1.3" ry="3.4" fill="#1e2a44"/><ellipse cx="58" cy="37" rx="1.3" ry="3.4" fill="#1e2a44"/>
            <path d="M47 44 h6 l-3 3 z" fill="#e88aa0" stroke="#1e2a44" stroke-width="1.2"/>
            <path d="M50 47 q -4 4 -8 2 M50 47 q 4 4 8 2" fill="none" stroke="#1e2a44" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M33 45 h-12 M33 48 l-11 4 M67 45 h12 M67 48 l11 4" stroke="#1e2a44" stroke-width="1.2"/>
            <rect x="38" y="54" width="24" height="5" rx="2.5" fill="#1e2a44"/>
          </svg>
          <div class="say" id="say">Betöltés...</div>
        </div>
      </div>
      <div class="card"><h2 id="dh">Eszközök</h2><div class="rooms" id="rooms"></div></div>
      <div class="card" id="logincard" hidden>
        <h2>Belépés</h2>
        <form class="login" id="loginform">
          <input id="em" type="email" autocomplete="username" placeholder="e-mail" required>
          <input id="pw" type="password" autocomplete="current-password" placeholder="jelszó" required>
          <button class="btn" type="submit">Belépés</button>
          <span class="err" id="lerr"></span>
        </form>
      </div>
    </div>
  </div>
  <div class="foot" id="foot">Első változat: a fotóhű, bútorozott térkép ezután jön.</div>
</div>

(function () {

  };
  // tűk: pink -> szint, hely (m), magasság
  var PINS = {
    T1: ['lo', 3.2, 3.4, 1.2], T8: ['lo', 1.0, 2.0, 1.2], T2: ['lo', 1.2, 7.4, 1.2], T3: ['lo', 1.0, 12.6, 1.2],

  function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function draw() {
    var L = LEVELS[st.level], svg = document.getElementById('plan'); svg.innerHTML = '';
    var xs = [], ys = [];
    L.rooms.forEach(function (r) { [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.d], [r.x + r.w, r.y + r.d]].forEach(function (q) { var a = P(q[0], q[1]), b = P(q[0], q[1], 3.2); xs.push(a[0]); ys.push(a[1], b[1]); }); });
    var cc = P(st.level === 'lo' ? 12.6 : 8.6, st.level === 'lo' ? 10.4 : 8.4, 0); xs.push(cc[0] - 95, cc[0] + 95); ys.push(cc[1] - 60, cc[1] + 105);
    var pad = 40, mx = Math.min.apply(0, xs) - pad, Mx = Math.max.apply(0, xs) + pad, my = Math.min.apply(0, ys) - pad, My = Math.max.apply(0, ys) + pad;
    svg.setAttribute('viewBox', mx + ' ' + my + ' ' + (Mx - mx) + ' ' + (My - my));
    var g = el('g', {}, svg), order = L.rooms.slice().sort(function (a, b) { return (a.x + a.y) - (b.x + b.y); });
    order.forEach(function (r) { var f = FLOOR[r.f]; el('polygon', { points: pts([P(r.x, r.y), P(r.x + r.w, r.y), P(r.x + r.w, r.y + r.d), P(r.x, r.y + r.d)]), fill: cssv(f[0]), stroke: cssv(f[1]), 'stroke-width': 1.2 }, g); });
    var s0 = L.stairs, n = 9;
    for (var i = 0; i < n; i++) {

      if (s0.dir === 'x') q = [P(s0.x + s0.w * t0, s0.y, z), P(s0.x + s0.w * t1, s0.y, z), P(s0.x + s0.w * t1, s0.y + s0.d, z), P(s0.x + s0.w * t0, s0.y + s0.d, z)];
      else q = [P(s0.x, s0.y + s0.d * t0, z), P(s0.x + s0.w, s0.y + s0.d * t0, z), P(s0.x + s0.w, s0.y + s0.d * t1, z), P(s0.x, s0.y + s0.d * t1, z)];

    var h = 1.15;
    order.forEach(function (r) {
      if (r.nowall) return;
      if (!r.join) el('polygon', { points: pts([P(r.x, r.y), P(r.x + r.w, r.y), P(r.x + r.w, r.y, h), P(r.x, r.y, h)]), fill: cssv('--wallA'), stroke: cssv('--wallB') }, g);
      el('polygon', { points: pts([P(r.x, r.y), P(r.x, r.y + r.d), P(r.x, r.y + r.d, h), P(r.x, r.y, h)]), fill: cssv('--wallB'), stroke: cssv('--wallB') }, g);
    });
    order.forEach(function (r) {
      if (!r.n) return; var c = P(r.x + r.w / 2, r.y + r.d / 2);
      var t = el('text', { x: c[0], y: c[1] + 4, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 900, fill: '#3a3020', opacity: .75 }, g); t.textContent = r.n;
    });
    if (st.level === 'lo') {   // Pamutka az erkélyen
      var pc = P(1.6, -0.9, 0);
      var cat = el('g', { transform: 'translate(' + (pc[0] - 30) + ' ' + (pc[1] - 58) + ') scale(.66)' }, g);
      cat.innerHTML = document.querySelector('.cat svg').innerHTML;
      var lab = el('text', { x: pc[0] + 3, y: pc[1] + 16, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 900, fill: '#fff', stroke: '#1e2a44', 'stroke-width': 3, 'paint-order': 'stroke' }, g); lab.textContent = 'Pamutka';
    }
    compass(g, mx, My);
    st.devs.forEach(function (d) {
      var p = PINS[d.pink]; if (!p || p[0] !== st.level) return;
      var s = devState(d), a = P(p[1], p[2], p[3]), b = P(p[1], p[2], 0), col = cssv(s.col);
      var pg = el('g', { class: 'pin' + (st.sel === d.pink ? ' sel' : ''), tabindex: 0, 'data-pink': d.pink, role: 'button', 'aria-label': d.label + ': ' + s.txt }, g);
      el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-dasharray': '2 2', opacity: .8 }, pg);
      var big = s.big;
      if (big) {
        var w = 12 + big.length * 7.2;
        el('rect', { class: 'bub ring', x: a[0] - w / 2, y: a[1] - 11, width: w, height: 22, rx: 11, fill: col, stroke: '#1e2a44', 'stroke-width': 2 }, pg);
        var tx = el('text', { x: a[0], y: a[1] + 4.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 900, fill: '#fff' }, pg); tx.textContent = big;
      } else {
        el('circle', { class: 'bub ring', cx: a[0], cy: a[1], r: 8, fill: col, stroke: '#1e2a44', 'stroke-width': 2 }, pg);
      }
      var ti = el('title', {}, pg); ti.textContent = d.label + ': ' + s.txt;
      pg.addEventListener('click', function () { select(d.pink); });
      pg.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d.pink); } });
    });
  }
  // Iránytű a talajon, a nap mai útjával (napkelte, napnyugta, a nap most) és a holnapi hőmérséklettel.
  function compass(g, mx, My) {
    var cx = st.level === 'lo' ? 12.6 : 8.6, cy = st.level === 'lo' ? 10.4 : 8.4, R = 1.4, S0 = window.F27Sun;
    var dir = function (az) {                          // azimut (É=0, K=90) -> síkbeli egységvektor (x jobbra, y le)
      var a = (az + PLAN_NORTH - 90) * Math.PI / 180; return [Math.cos(a), Math.sin(a)];
    };
    var at = function (az, r) { var v = dir(az); return P(cx + v[0] * r, cy + v[1] * r, 0); };
    var cg = el('g', { class: 'compass' }, g), ring = [];
    for (var i = 0; i <= 36; i++) ring.push(at(i * 10, R));
    el('polygon', { points: pts(ring), fill: '#fff7e6', 'fill-opacity': .92, stroke: '#1e2a44', 'stroke-width': 2.5 }, cg);
    var n0 = at(0, R * 0.8), s0 = at(180, R * 0.8), c0 = P(cx, cy, 0), e0 = at(90, R * 0.18), w0 = at(270, R * 0.18);
    el('polygon', { points: pts([e0, n0, w0]), fill: '#e8432f', stroke: '#1e2a44', 'stroke-width': 1.4 }, cg);
    el('polygon', { points: pts([e0, s0, w0]), fill: '#ffffff', stroke: '#1e2a44', 'stroke-width': 1.4 }, cg);
    var lbl = function (az, t, col) { var q = at(az, R * 1.28); var x = el('text', { x: q[0], y: q[1] + 5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 900, fill: col, stroke: '#1e2a44', 'stroke-width': 3, 'paint-order': 'stroke' }, cg); x.textContent = t; };
    lbl(0, 'É', '#ff6b52'); lbl(90, 'K', '#fff'); lbl(180, 'D', '#fff'); lbl(270, 'NY', '#fff');
    if (!S0) return;
    var now = Date.now(), t = S0.times(now, LAT, LON), sp = S0.pos(now, LAT, LON), tip = '';
    if (t.rise) {
      var arc = []; for (var k = 0; k <= 16; k++) arc.push(at(t.riseAz + (t.setAz - t.riseAz) * k / 16, R * 0.95));
      el('polyline', { points: pts(arc), fill: 'none', stroke: '#ffd23f', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: .95 }, cg);
      var r0 = at(t.riseAz, R * 0.95), s1 = at(t.setAz, R * 0.95);
      el('circle', { cx: r0[0], cy: r0[1], r: 4, fill: '#ff9f1c', stroke: '#1e2a44', 'stroke-width': 1.4 }, cg);
      el('circle', { cx: s1[0], cy: s1[1], r: 4, fill: '#c8321f', stroke: '#1e2a44', 'stroke-width': 1.4 }, cg);
      if (sp.alt > 0) { var q = at(sp.az, R * 0.95); el('circle', { cx: q[0], cy: q[1], r: 7, fill: '#ffd23f', stroke: '#1e2a44', 'stroke-width': 2 }, cg); }
      tip = 'Napkelte ' + S0.hm(t.rise) + ' (' + Math.round(t.riseAz) + '°), napnyugta ' + S0.hm(t.set) + ' (' + Math.round(t.setAz) + '°). ';
    }
    var dl = st.daily, base = P(cx, cy + R * 1.05, 0);
    var t1 = el('text', { x: base[0], y: base[1] + 36, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 900, fill: '#ffd23f', stroke: '#1e2a44', 'stroke-width': 3, 'paint-order': 'stroke' }, cg);
    t1.textContent = t.rise ? '↑' + S0.hm(t.rise) + ' · ↓' + S0.hm(t.set) : '';
    var t2 = el('text', { x: base[0], y: base[1] + 52, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 900, fill: '#fff', stroke: '#1e2a44', 'stroke-width': 3, 'paint-order': 'stroke' }, cg);
    t2.textContent = dl && dl.tmin != null ? 'holnap ' + fmt(dl.tmin, 0) + '…' + fmt(dl.tmax, 0) + ' °C' : 'holnap: --';
    var ti = el('title', {}, cg);
    ti.textContent = tip + (dl && dl.tmin != null ? 'Holnap ' + fmt(dl.tmin, 0) + '…' + fmt(dl.tmax, 0) + ' °C várható (Open-Meteo). ' : '') +
      'A sárga ív a nap mai útja: délután és este az erkélyes (ÉNy-i) homlokzat kapja a napot, délelőtt a túloldal.';
  }
  function fetchDaily() {
    if (!window.fetch) return;
    fetch(DAILY_URL, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var d = j && j.daily; if (!d || !d.time || d.time.length < 2) return;
      st.daily = { tmin: d.temperature_2m_min[1], tmax: d.temperature_2m_max[1] }; draw();
    }, function () {});
  }
  function select(pink) {
    st.sel = st.sel === pink ? null : pink;
    var p = PINS[pink]; if (st.sel && p && p[0] !== st.level) setLevel(p[0]); else { draw(); list(); }
  }
  function setLevel(l) {
    st.level = l;
    document.getElementById('l-lo').setAttribute('aria-pressed', l === 'lo');
    document.getElementById('l-up').setAttribute('aria-pressed', l === 'up');
    draw(); list();
  }

  // ---- lista, csempék, Pamutka ----------------------------------------------------------------------
  function list() {
    var by = {};
    st.devs.filter(function (d) { return d.role !== 'ir_hub'; }).forEach(function (d) { (by[d.room] = by[d.room] || []).push(d); });
    var box = document.getElementById('rooms'); box.innerHTML = '';
    Object.keys(ROOM_NAMES).forEach(function (rid) {
      var ds = by[rid]; if (!ds) return;
      var sec = document.createElement('div'); sec.className = 'room';
      sec.innerHTML = '<h3>' + ROOM_NAMES[rid] + '</h3>';
      ds.forEach(function (d) {
        var s = devState(d), row = document.createElement('div');
        row.className = 'dev' + (st.sel === d.pink ? ' sel' : ''); row.tabIndex = 0;
        row.innerHTML = '<span class="dot" style="background:var(' + s.col + ')"></span><span></span><span class="val ' + s.cls + '"></span>';
        row.children[1].textContent = d.label; row.children[2].textContent = s.txt;
        row.addEventListener('click', function () { select(d.pink); });
        sec.appendChild(row);
      });
      box.appendChild(sec);
    });
    document.getElementById('dh').textContent = 'Eszközök · ' + st.devs.filter(function (d) { return st.latest[d.pink] && st.latest[d.pink].online !== false; }).length + ' online';
  }
  function chip(id, cv, cs, cls) {
    var c = document.getElementById(id); c.hidden = false; c.className = 'chip' + (cls ? ' ' + cls : '');
    c.querySelector('.cv').textContent = cv; if (cs != null) c.querySelector('.cs').textContent = cs;
  }
  function ago(ms) { var m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'most' : m < 60 ? m + ' p' : m < 1440 ? Math.floor(m / 60) + ' ó ' + (m % 60) + ' p' : Math.floor(m / 1440) + ' nap'; }
  function chips() {
    chip('c-out', st.wx && st.wx.temp != null ? fmt(st.wx.temp) + ' °C' : '--', 'XI. kerület');
    var ins = st.devs.filter(function (d) { return d.role === 'thermo' && d.room !== 'erkely'; }).map(function (d) { var r = st.latest[d.pink]; return r && r.online !== false ? temp(r.status) : null; }).filter(function (x) { return x != null; });
    var avg = ins.length ? ins.reduce(function (a, b) { return a + b; }, 0) / ins.length : null;
    chip('c-in', avg == null ? '--' : fmt(avg) + ' °C', 'cél: ' + target() + ' °C · ' + ins.length + ' hőmérő', avg != null && avg > target() + 1 ? 'warn' : '');
    // a fenti fürdő köre (X1) a bojlert is táplálja: ha a kör mér, a bojler konnektorát (C1) nem adjuk hozzá még egyszer
    var x1 = st.latest.X1 && st.latest.X1.online !== false && watts(st.latest.X1.status) != null;
    var w = st.devs.filter(function (d) { return (d.role === 'plug' || d.role === 'breaker') && !(x1 && d.pink === 'C1'); }).reduce(function (a, d) { var r = st.latest[d.pink]; var x = r && r.online !== false ? watts(r.status) : null; return a + (x || 0); }, 0);
    chip('c-pow', fmt(w, 0) + ' W', x1 ? 'konnektorok + fenti fürdőkör' : 'mért konnektorok');
    chip('c-mot', st.motion ? ago(st.motion) : '--', st.motion ? 'lépcső teteje' : 'még nem volt');
    var due = (st.bat || []).filter(function (r) { return r.level === 'due30' || r.level === 'due14' || r.level === 'dead'; });
    if (due.length) {
      due.sort(function (a, b) { return ({ dead: 0, due14: 1, due30: 2 })[a.level] - ({ dead: 0, due14: 1, due30: 2 })[b.level]; });
      var r0 = due[0], hot = r0.level !== 'due30';
      chip('c-bat', r0.label || r0.pink, (r0.level === 'dead' ? 'lemerült, cseréld most' : r0.eta_lo <= 0 ? 'két héten belül' : 'kb. ' + r0.eta_lo + '-' + r0.eta_hi + ' nap') + (due.length > 1 ? ' · +' + (due.length - 1) : ''), hot ? 'hot' : 'warn');
      document.querySelector('#c-bat .ck').textContent = 'ELEMCSERE' + (due.length > 1 ? ' · ' + due.length : '');
    } else document.getElementById('c-bat').hidden = true;
  }
  function pamutka() {
    var tips = [], tg = target();
    st.devs.forEach(function (d) {
      var r = st.latest[d.pink]; if (!r) return;
      if (d.role === 'thermo' && d.room !== 'erkely' && r.online !== false) {
        var t = temp(r.status);
        if (t != null && t > tg + 1) tips.push('<b>' + ROOM_NAMES[d.room] + '</b>: ' + fmt(t) + ' °C, a cél ' + tg + '. Egy fokkal lejjebb kb. 6% gázt spórolsz.');
        if (t != null && t < tg - 1.5) tips.push('<b>' + ROOM_NAMES[d.room] + '</b>: csak ' + fmt(t) + ' °C. Nem hűl ki? Nézd meg a radiátorszelepet.');
      }
      if (d.role === 'plug' && d.pink === 'C1' && r.online !== false) {
        var w = watts(r.status);
        if (w && w > 500) tips.push('A <b>fenti bojler</b> most fűt (' + fmt(w, 0) + ' W).');
      }
    });
    var off = st.devs.filter(function (d) { return d.role === 'thermo' && st.latest[d.pink] && st.latest[d.pink].online === false; });
    if (off.length) tips.push(off.length + ' hőmérő offline (' + off.map(function (d) { return ROOM_NAMES[d.room]; }).join(', ') + '): valószínűleg elem kell bele.');
    (st.bat || []).forEach(function (b) { if (b.level === 'due14' || b.level === 'dead') tips.push('Elemcsere: <b>' + (b.label || b.pink) + '</b>' + (b.level === 'dead' ? ', most.' : ', két héten belül.')); });
    var html = tips.length ? 'Miaú! Ezt láttam:<ul>' + tips.slice(0, 5).map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' : 'Minden rendben, dorombolok. A szobák a cél körül vannak.';
    document.getElementById('say').innerHTML = html + (st.live ? '' : '<br><small><i>Demó: belépés után a valódi adatokból szólok.</i></small>');
  }
  function render() {
    document.getElementById('demo').hidden = st.live;
    chips(); draw(); list(); pamutka();
    document.getElementById('foot').textContent = (st.live ? 'Élő adat a Supabase-ből, 10 percenként frissül. ' : 'Demó mód. ') + 'Első változat: a fotóhű, bútorozott térkép ezután jön.';
  }

  // ---- Supabase ---------------------------------------------------------------------------------
  var cfg = window.F27_CONFIG || {}, sb = null;
  function load() {
    if (!sb || !st.user) return;
    Promise.all([
      sb.from('devices').select('pink,role,room,label'),
      sb.from('device_latest').select('pink,ts,online,status'),
      sb.from('battery_status').select('pink,label,level,eta_lo,eta_hi'),
      sb.from('weather_hourly').select('ts,temp,is_forecast').gte('ts', new Date(Date.now() - 6 * 3600e3).toISOString()).order('ts', { ascending: false }).limit(60),
      sb.from('device_status').select('ts,status').eq('pink', 'M1').gte('ts', new Date(Date.now() - 7 * 864e5).toISOString()).order('ts', { ascending: false }).limit(200)
    ]).then(function (r) {
      if (r[1].error) { document.getElementById('say').textContent = 'Az adatbázis most nem érhető el.'; return; }
      if (r[0].data && r[0].data.length) {
        var known = {}; DEFAULT_DEVS.forEach(function (d) { known[d.pink] = d; });
        st.devs = r[0].data.map(function (d) { return Object.assign({}, known[d.pink] || {}, d, { room: d.room || (known[d.pink] || {}).room }); });
      }
      st.latest = {}; (r[1].data || []).forEach(function (x) { st.latest[x.pink] = x; });
      st.bat = r[2].error ? [] : (r[2].data || []);
      var past = (r[3].data || []).filter(function (x) { return Date.parse(x.ts) <= Date.now(); });
      st.wx = r[3].error || !past.length ? null : past[0];
      var mv = (r[4].data || []).filter(function (x) { return x.status && x.status.pir === 'pir'; });
      st.motion = mv.length ? Date.parse(mv[0].ts) : null;
      st.live = true; render();
    });
  }
  function setUser(u) {
    st.user = u;
    document.getElementById('who').textContent = u ? 'Belépve: ' + (u.email || '') : 'Nem vagy belépve';
    document.getElementById('b-login').textContent = u ? 'Kilépés' : 'Belépés';
    document.getElementById('logincard').hidden = true;
    if (u) load(); else { st.live = false; st.devs = DEFAULT_DEVS; demo(); render(); }
  }
  if (cfg.supabaseUrl && cfg.supabaseKey && window.supabase && window.supabase.createClient) {

  }
  if (sb) sb.auth.onAuthStateChange(function (ev, ses) { setTimeout(function () { setUser(ses && ses.user ? ses.user : null); }, 0); });

    err.textContent = '';
    sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (res) {
      if (res.error) err.textContent = 'Hibás e-mail vagy jelszó.';
    });
  });
  document.getElementById('l-lo').addEventListener('click', function () { setLevel('lo'); });
  document.getElementById('l-up').addEventListener('click', function () { setLevel('up'); });
  setInterval(load, 5 * 60000);
  setInterval(fetchDaily, 3 * 3600000); setInterval(draw, 10 * 60000);
  demo(); render(); fetchDaily();
})();
