<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3fae6a">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="F27 Energy Quest: a lakás izometrikus térképe, húzható bútorokkal és eszközökkel, mentett elrendezésekkel.">
<title>F27 Energy Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Baloo+2:wght@800&amp;family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
a{color:#1e2a44}a:hover{color:#ff4fa3}
.lil{font-family:"Lilita One","Baloo 2","Nunito",sans-serif;letter-spacing:.4px}
.fr{font-family:"Fraunces",Georgia,serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes ghost{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-8px)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
@keyframes fire{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes flick{0%,100%{opacity:1}35%{opacity:.7}60%{opacity:.95}80%{opacity:.78}}
@keyframes ring{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.7);opacity:0}}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-50px);opacity:0}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spark{0%,100%{transform:scale(.4) rotate(0deg);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
@keyframes flag{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-7deg)}}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translate(6px,-56px) scale(1.5);opacity:0}}
@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,60,.7)}100%{box-shadow:0 0 0 12px rgba(255,90,60,0)}}
.gh1{animation:ghost 3.4s ease-in-out infinite}
.gh2{animation:ghost 2.7s ease-in-out infinite .9s}
.coin{animation:spin 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fire{animation:fire .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.mk{animation:bob 3s ease-in-out infinite}
.flick{animation:flick 1.3s ease-in-out infinite}
.ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ring2{animation:ring 1.8s ease-out infinite .9s;transform-box:fill-box;transform-origin:center}
.note{animation:note 2.6s ease-out infinite}
.note2{animation:note 2.6s ease-out infinite 1.3s}
.cloud{animation:drift 24s ease-in-out infinite alternate}
.cloud2{animation:drift 31s ease-in-out infinite alternate-reverse}
.tw{animation:tw 3.4s ease-in-out infinite}
.spark{animation:spark 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flag{animation:flag 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.rise{animation:rise 4.2s ease-out infinite}
.rise2{animation:rise 5s ease-out infinite 1.6s}
.pop{animation:pop 2.4s ease-in-out infinite}
.trail{animation:dash 1.6s linear infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.root{user-select:none;-webkit-user-select:none}
.pc{cursor:grab;touch-action:none}
.pc:hover{filter:brightness(1.06) drop-shadow(0 0 3px #ffffff)}
.pc.sel{filter:drop-shadow(0 0 4px #ff4fa3) drop-shadow(0 0 2px #ff4fa3)}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 14px 6px rgba(30,42,68,.45)) brightness(1.08)}
.wall{pointer-events:none}
.panel{box-sizing:border-box;border-radius:24px;background:#fbf1dc;border:4px solid #1e2a44;box-shadow:0 6px 0 #1e2a44}
.qb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;width:100%;padding:10px 12px;border-radius:16px;border:2px solid #e3cfa6;background:#fffaf0;font-family:"Nunito",sans-serif;transition:transform .12s}
.qb:hover{transform:translateY(-1px)}
.qb:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.qb.on{border-color:#1e2a44;background:#fff1c9;box-shadow:0 3px 0 #1e2a44}
.pu{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border-radius:16px;border:3px solid #1e2a44;background:#fff7e6;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;transition:transform .12s}
.pu:hover{transform:translateY(-2px)}
.pu:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.pu.on{background:#ffe066;box-shadow:0 4px 0 #1e2a44,inset 0 0 0 3px #ff4fa3}
.lv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:8px 12px;border-radius:16px;border:3px solid #1e2a44;background:#ffffff;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;transition:transform .12s}
.lv:hover{transform:translateY(-2px)}
.lv:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.lv.on{background:#2f6fe4;color:#ffffff}
.lv.boss{background:#ffd9cc}
.lv.boss.on{background:#e8432f;color:#ffffff}
.livepill{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:2.5px solid #1e2a44;background:#ffffff;color:#1e2a44;font:900 11.5px/1 "Nunito",sans-serif;letter-spacing:.6px;box-shadow:0 2px 0 #1e2a44}
.livepill:hover{background:#ffe066}
.livepill:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.livepill .ld{width:8px;height:8px;border-radius:50%;background:#8a8f9c;border:1.5px solid #1e2a44}
.livepill.on{background:#3fae6a;color:#ffffff}
.livepill.on .ld{background:#ff4f6d;animation:livepulse 1.6s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 16px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44}
.ck{font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:#45507a}
.cv{font-family:"Lilita One","Baloo 2",sans-serif;font-size:23px;line-height:1.05;color:#1e2a44}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:3px solid #1e2a44;box-sizing:border-box}
.tag{font-size:9.5px;font-weight:900;letter-spacing:.8px;color:#ffffff;padding:2px 8px;border-radius:999px;border:2px solid #1e2a44}
.pin{all:unset;position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;cursor:grab;touch-action:none;z-index:2}
.pin:active{cursor:grabbing}
.pin.drag{z-index:5}
.pin .dot{position:absolute;inset:0;border-radius:50%;border:3px solid #1e2a44;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#ffffff;font-family:"Lilita One","Baloo 2",sans-serif;font-size:13px;box-shadow:0 3px 0 #1e2a44;transition:transform .12s}
.pin.sm .dot{font-size:11px}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.15)}
.pin:focus-visible{outline:none}
.pin:focus-visible .dot{outline:3px solid #ffffff;outline-offset:2px}
.pin.sel .dot{outline:3px solid #ffe066;outline-offset:2px}
.pin.drag .dot{transform:scale(1.2);box-shadow:0 10px 8px rgba(30,42,68,.45)}
.pin.alert .dot{animation:pulse 1.4s ease-out infinite}
.pin .val{position:absolute;left:34px;top:4px;white-space:nowrap;font-family:"Nunito",sans-serif;font-weight:900;font-size:12px;line-height:18px;padding:0 8px;border-radius:999px;border:2px solid #1e2a44;background:#ffffff;color:#1e2a44}
.pin .val.l{left:auto;right:34px}
.pin .val.hot{background:#ffd9cc}
.pin .val.bad{background:#ff5a3c;color:#ffffff}
.pin .tip{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);white-space:nowrap;font-family:"Nunito",sans-serif;font-weight:800;font-size:12px;padding:6px 10px;border-radius:12px;background:#1e2a44;color:#fff7e6;opacity:0;pointer-events:none;transition:opacity .12s}
.pin:hover .tip,.pin:focus-visible .tip{opacity:1}
.btn{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:3px solid #1e2a44;background:#ffffff;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;font-weight:900;font-size:13px;color:#1e2a44}
.btn:hover{background:#fff1c9}
.btn:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}

/* ---- élő térkép: keret, fiók, mentés, értesítések ---- */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html,body{height:100%}
body{margin:0;background:#1e2a44;overflow:hidden;touch-action:none}
.drawer{touch-action:pan-y}
body.zoomed #stage{cursor:grab}
body.panning,body.panning #stage,body.panning *{cursor:grabbing!important}
.zoombar{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;align-items:center;gap:6px;padding:6px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif}
.zoombar .zb{all:unset;box-sizing:border-box;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#ffffff;border:2.5px solid #1e2a44;color:#1e2a44;font:900 22px/1 "Nunito",sans-serif;cursor:pointer}
.zoombar .zb:hover{background:#ffe066}
.zoombar .zb:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.zoombar .zb:disabled{opacity:.35;cursor:default;background:#ffffff}
.zoombar .zl{min-width:52px;text-align:center;font:900 14px "Nunito",sans-serif;color:#1e2a44}
@media (max-width:600px){.zoombar{right:8px;bottom:8px;gap:4px;padding:4px}.zoombar .zb{width:44px;height:44px}}
#stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:#ffffff}
.btn.ib{width:44px;padding:0;justify-content:center}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:12px;box-shadow:0 3px 0 #1e2a44}
.btn.ib.sm{width:36px;padding:0}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:10px;border-width:2px;box-shadow:0 2px 0 #1e2a44}
.btn.primary{background:#ffe066}
.btn.primary:hover{background:#ffd23f}
.btn.danger{background:#ff5a3c;color:#ffffff}
.btn.danger:hover{background:#e8432f}
.btn.acct{align-self:center;min-height:40px}
.stchip{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;border:3px solid #1e2a44;background:#fff7e6;font-family:"Nunito",sans-serif;font-weight:900;font-size:12.5px;color:#1e2a44;white-space:nowrap}
.stchip:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.stchip .sd{width:10px;height:10px;border-radius:50%;background:#9aa3ad;border:2px solid #1e2a44}
.stchip.dirty{background:#ffe1d6}
.stchip.dirty .sd{background:#ff5a3c}
.stchip.saved .sd{background:#3fae6a}
.stchip.mini{height:28px;margin-top:6px;padding:0 10px;border-width:2px;border-radius:10px;font-size:11.5px;cursor:default}
.drawer{position:absolute;left:1144px;top:96px;width:280px;height:632px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:10;overflow-y:auto;font-family:"Nunito",sans-serif}
.drawer .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.drawer form.login{display:grid;gap:6px}
.drawer label{font-size:11px;font-weight:900;letter-spacing:.8px;color:#45507a}
.drawer input{box-sizing:border-box;width:100%;height:38px;padding:0 10px;border-radius:10px;border:2px solid #1e2a44;background:#ffffff;font:700 14px "Nunito",sans-serif;color:#1e2a44}
.drawer input:focus-visible{outline:3px solid #ff4fa3;outline-offset:1px}
.drawer form.login .btn{margin-top:6px;justify-content:center}
.drawer .passw{position:relative}
.drawer .passw input{padding-right:44px}
.drawer .peek{all:unset;box-sizing:border-box;position:absolute;right:3px;top:3px;width:36px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.drawer .peek:hover{background:#fff1c9}
.drawer .peek:focus-visible{outline:3px solid #ff4fa3;outline-offset:0}
.drawer .peek[aria-pressed="true"]{background:#ffe066}
.drawer label.remember{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:800;letter-spacing:0;color:#1e2a44;cursor:pointer}
.drawer label.remember input{width:20px;height:20px;margin:0;accent-color:#3fae6a;cursor:pointer}
.drawer .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.drawer form.row input{flex:1 1 120px;width:auto;height:30px}
.drawer .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800}
.drawer .who .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .sect{margin-top:4px;font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:#45507a;border-top:2px dashed #e3cfa6;padding-top:10px}
.drawer .cur{font-size:13px;font-weight:700}
.drawer .note{margin:0;font-size:12px;font-weight:800;color:#9a3412;background:#fff1c9;border:2px solid #e3cfa6;border-radius:10px;padding:6px 8px}
.drawer .list{display:flex;flex-direction:column;gap:6px}
.drawer .lrow{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;border:2px solid #e3cfa6;background:#fffaf0}
.drawer .lrow.cur{border-color:#1e2a44;background:#fff1c9}
.drawer .lname{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;overflow:hidden}
.drawer .lname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .ltime{font-size:11px;font-weight:700;color:#45507a}
.drawer .warn{font-size:12px;font-weight:900;color:#b02a17}
.drawer .alap{margin-top:auto;font-size:12px;font-weight:800}
.toasts{position:absolute;left:470px;top:96px;width:500px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
.toast{max-width:500px;padding:10px 16px;border-radius:14px;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;background:#fffdf7;font:900 13.5px "Nunito",sans-serif;color:#1e2a44;text-align:center}
.toast.ok{background:#c8f2d4}
.toast.err{background:#ffd9cc}

/* ---- Eszközök panel (a színpadon kívül, hogy telefonon is olvasható legyen) ---- */
.btn.devbtn{align-self:center;min-height:40px;position:relative;padding:0 12px}
.devbtn .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#1e2a44;color:#ffe066;font:900 12px/1 "Nunito",sans-serif}
.devbtn .wdot{position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;border:2.5px solid #1e2a44}
.devbtn .wdot.red{background:#ff4f6d;animation:livepulse 1.6s ease-in-out infinite}
.devbtn .wdot.orange{background:#ff9f1c}
#devlayer{position:fixed;inset:0;z-index:60;pointer-events:none}
.devpanel{pointer-events:auto;position:fixed;right:12px;top:var(--dp-top,12px);bottom:76px;width:380px;max-width:calc(100vw - 24px);box-sizing:border-box;display:flex;flex-direction:column;border-radius:22px;border:3px solid #1e2a44;background:#fffdf7;box-shadow:0 6px 0 #1e2a44,0 18px 40px rgba(14,20,40,.35);font-family:"Nunito",sans-serif;color:#1e2a44;overflow:hidden;animation:dpin .22s ease-out;touch-action:pan-y}
@keyframes dpin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dp-head{flex:0 0 auto;padding:14px 14px 10px;background:linear-gradient(180deg,#fff1c9,#fffdf7);border-bottom:3px solid #1e2a44}
.dp-top{display:flex;align-items:center;gap:8px}
.dp-title{font-family:"Fraunces",serif;font-weight:800;font-size:22px;color:#3b2a14;flex:1 1 auto}
.dp-src{padding:3px 8px;border-radius:999px;font:900 10.5px/1.2 "Nunito",sans-serif;letter-spacing:1px;border:2px solid #1e2a44}
.dp-src.demo{background:#1e2a44;color:#ffe066}
.dp-src.live{background:#3fae6a;color:#ffffff}
.dp-xp{margin-top:8px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:13px}
.dp-xp .bar{flex:1 1 auto;height:14px;border-radius:8px;border:2.5px solid #1e2a44;background:#eee3cc;overflow:hidden}
.dp-xp .bar span{display:block;height:100%;background:repeating-linear-gradient(45deg,#3fae6a 0 8px,#52c47d 8px 16px)}
.dp-warn{margin-top:6px;font-weight:900;font-size:12.5px}
.dp-warn.red{color:#c8321f}.dp-warn.orange{color:#b45309}.dp-warn.ok{color:#2f7d4f}
.dp-tabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 12px 8px;border-bottom:2px dashed #e3cfa6;scrollbar-width:none}
.dp-tab{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:2px solid #1e2a44;background:#ffffff;font:900 12px "Nunito",sans-serif;color:#1e2a44}
.dp-tab .n{font-size:11px;opacity:.7}
.dp-tab.hot{background:#ffe1d6}
.dp-tab.on{background:#1e2a44;color:#ffe066}
.dp-tab.on .n{opacity:1}
.dp-tab:focus-visible,.dcard:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.dp-list{flex:1 1 auto;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.dp-empty{margin:20px 0;text-align:center;font-weight:900;color:#45507a}
.dcwrap{display:flex;flex-direction:column}
.dcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 10px;padding:10px;border-radius:16px;border:2.5px solid #1e2a44;background:#ffffff;box-shadow:0 3px 0 #1e2a44;width:100%}
.dcard:hover{background:#fffaf0}
.dcard.warn{background:#fff6e0}
.dcard.red{background:#ffefe9}
.dcard.sel{border-color:#ff4fa3;box-shadow:0 3px 0 #ff4fa3}
.dc-tile{grid-row:1 / span 3;width:48px;height:48px;border-radius:14px;border:2.5px solid #1e2a44;display:flex;align-items:center;justify-content:center;position:relative}
.dc-tile .pn{position:absolute;right:-7px;bottom:-7px;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#ff4fa3;color:#ffffff;border:2px solid #1e2a44;font:900 10.5px/16px "Nunito",sans-serif;text-align:center}
.dc-row{display:flex;align-items:center;gap:6px;min-width:0}
.dc-name{font-weight:900;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.dc-room{font-weight:800;font-size:11.5px;color:#6b7280;white-space:nowrap}
.dc-dot{width:9px;height:9px;border-radius:50%;border:2px solid #1e2a44;flex:0 0 auto}
.dc-dot.on{background:#3fae6a}.dc-dot.off{background:#ff4f6d}.dc-dot.unk{background:#c4c8d0}
.dc-val{font-family:"Lilita One","Baloo 2","Nunito",sans-serif;font-size:20px;line-height:1.1;color:#1e2a44;white-space:nowrap}
.dc-val.good{color:#2f7d4f}.dc-val.bad{color:#c8321f}.dc-val.hot{color:#b8461b}.dc-val.warm{color:#b45309}.dc-val.muted{color:#8a8f9c;font-size:16px}
.dc-seen{font-weight:800;font-size:11.5px;color:#45507a;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpw{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:11px;white-space:nowrap}
.hp{display:inline-block;width:38px;height:9px;border-radius:5px;border:2px solid #1e2a44;background:#eee3cc;overflow:hidden}
.hp span{display:block;height:100%;background:#3fae6a}
.hp.orange span{background:#ff9f1c}.hp.red span{background:#ff4f6d}
.dc-badges{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.bdg{padding:2px 8px;border-radius:999px;border:2px solid #1e2a44;font:900 11px/1.3 "Nunito",sans-serif}
.bdg.red{background:#ff4f6d;color:#ffffff}.bdg.orange{background:#ff9f1c;color:#1e2a44}.bdg.green{background:#c8f2d4;color:#1e5a36}.bdg.grey{background:#e5e7eb;color:#374151}
.dc-note{grid-column:1 / -1;margin-top:4px;padding:6px 8px;border-radius:10px;background:#fff1c9;border:2px solid #e3cfa6;font-weight:800;font-size:12px;color:#9a3412}
.dc-det{margin:-6px 6px 2px;padding:12px 10px 8px;border:2.5px solid #1e2a44;border-top:0;border-radius:0 0 14px 14px;background:#fffaf0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:12px}
.dc-det .k{font-weight:800;color:#45507a;overflow:hidden;text-overflow:ellipsis}
.dc-det .k.raw{font-weight:700;color:#8a8f9c}
.dc-det .v{font-weight:900;text-align:right;white-space:nowrap}
@media (max-width:700px){
.devpanel{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:62vh;border-radius:22px 22px 0 0;border-bottom:0;animation:dpup .24s ease-out}
.dp-head{padding-top:18px;position:relative}
.dp-head::before{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#c9b68f}
}
@keyframes dpup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ---- Energiaőr: tanácsadó a térkép bal alsó sarkában (a lakáson kívül) ---- */
.adv{--adv-play:paused;--adv-talk:0;font-family:"Nunito",sans-serif;color:#1e2a44}
.adv.talk{--adv-play:running;--adv-talk:1}
.adv-stage{position:absolute;left:302px;top:646px;width:520px;height:82px;pointer-events:none;z-index:5}
.adv-char{all:unset;box-sizing:border-box;pointer-events:auto;cursor:pointer;position:absolute;left:0;top:0;width:67px;height:82px;border-radius:16px}
.adv-char:focus-visible,.adv-bubble:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.adv-char svg{display:block;width:67px;height:82px;overflow:visible}
.adv-char .mb{position:absolute;right:0;top:4px;width:20px;height:20px;border-radius:50%;background:#ffffff;border:2px solid #1e2a44;display:flex;align-items:center;justify-content:center}
.adv-bubble{all:unset;box-sizing:border-box;pointer-events:auto;cursor:pointer;position:absolute;left:80px;top:-4px;max-width:430px;min-height:38px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-radius:14px;border:2.5px solid #1e2a44;background:#fffdf7;box-shadow:0 3px 0 #1e2a44;font:900 13px/1.25 "Nunito",sans-serif;color:#1e2a44}
.adv-bubble::before{content:"";position:absolute;left:-9px;top:11px;width:12px;height:12px;background:inherit;border-left:2.5px solid #1e2a44;border-bottom:2.5px solid #1e2a44;transform:rotate(45deg);border-radius:0 0 0 3px}
.adv-bubble .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.adv-bubble .c{flex:0 0 auto;font-size:10.5px;font-weight:900;color:#6b7280}
.adv-bubble.red{background:#ffefe9}.adv-bubble.orange{background:#fff6e0}.adv-bubble.green{background:#e7f8ec}.adv-bubble.blue{background:#eaf5ff}
.adv.talk .adv-bubble{animation:advpop .32s ease-out}
@keyframes advpop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}
.adv-fixed{display:none}
@media (max-width:700px){
.adv-stage{display:none}
.adv-fixed{display:block;position:fixed;left:8px;bottom:8px;width:60px;height:72px;pointer-events:none;z-index:1}
.adv-fixed .adv-char{width:60px;height:72px}
.adv-fixed .adv-char svg{width:60px;height:72px}
.adv-fixed .adv-bubble{left:68px;top:auto;bottom:66px;width:calc(100vw - 92px);max-width:none}
.adv-fixed .adv-bubble::before{top:auto;bottom:-9px;left:12px;transform:rotate(-45deg)}
.adv-fixed .adv-bubble .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
/* a karakterek (szimbólumként, a use példányokba a változók öröklődnek) */
.adv-bob{animation:advbob 2.8s ease-in-out infinite}
@keyframes advbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.adv-blink{transform-box:fill-box;transform-origin:center;animation:advblink 4.6s infinite}
@keyframes advblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.adv-eqb{transform-box:fill-box;transform-origin:center bottom;animation:adveq .45s ease-in-out infinite alternate;animation-play-state:var(--adv-play,paused)}
.adv-eqb:nth-child(2){animation-delay:.15s}.adv-eqb:nth-child(3){animation-delay:.3s}.adv-eqb:nth-child(4){animation-delay:.08s}
@keyframes adveq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.adv-sway{transform-box:view-box;transform-origin:36px 84px;animation:advsway 3.6s ease-in-out infinite}
@keyframes advsway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.adv-wave{transform-box:view-box;transform-origin:53px 43px;animation:advwave .5s ease-in-out infinite alternate;animation-play-state:var(--adv-play,paused)}
@keyframes advwave{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.adv-eq{opacity:var(--adv-talk,0);transition:opacity .2s}
.adv-smile{opacity:calc(1 - var(--adv-talk,0));transition:opacity .2s}
@media (prefers-reduced-motion:reduce){.adv-bob,.adv-blink,.adv-eqb,.adv-sway,.adv-wave,.adv.talk .adv-bubble{animation:none!important}}
/* tanácslista */
.advpop{pointer-events:auto;position:fixed;left:max(8px,var(--adv-x,16px));bottom:var(--adv-y,120px);width:370px;max-width:calc(100vw - 16px);max-height:min(62vh,540px);box-sizing:border-box;display:flex;flex-direction:column;border-radius:20px;border:3px solid #1e2a44;background:#fffdf7;box-shadow:0 6px 0 #1e2a44,0 18px 40px rgba(14,20,40,.35);font-family:"Nunito",sans-serif;color:#1e2a44;overflow:hidden;animation:dpup .2s ease-out;touch-action:pan-y}
.ap-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;background:linear-gradient(180deg,#e7f8ec,#fffdf7);border-bottom:3px solid #1e2a44}
.ap-head svg{width:34px;height:42px;flex:0 0 auto}
.ap-title{font-family:"Fraunces",serif;font-weight:800;font-size:19px;color:#3b2a14;flex:1 1 auto}
.ap-n{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#1e2a44;color:#ffe066;font:900 12px/22px "Nunito",sans-serif;text-align:center}
.ap-list{list-style:none;margin:0;padding:10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.adv-tip{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px;border-radius:14px;border:2px solid #e3cfa6;background:#ffffff;font-size:12.5px;font-weight:800;line-height:1.35}
.adv-tip .d{width:10px;height:10px;margin-top:3px;border-radius:50%;border:2px solid #1e2a44}
.adv-tip.red .d{background:#ff4f6d}.adv-tip.orange .d{background:#ff9f1c}.adv-tip.green .d{background:#3fae6a}.adv-tip.blue .d{background:#4fc3f7}
.adv-tip.cur{border-color:#1e2a44}
.ap-foot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 10px;border-top:2px dashed #e3cfa6;font-size:12px;font-weight:900}
.ap-var{display:inline-flex;align-items:center;gap:4px;color:#45507a}
.adv-var{all:unset;box-sizing:border-box;cursor:pointer;height:26px;padding:0 9px;border-radius:999px;border:2px solid #1e2a44;background:#ffffff;font:900 11.5px "Nunito",sans-serif;color:#1e2a44}
.adv-var.on{background:#3fae6a;color:#ffffff}
.adv-var:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
@media (max-width:700px){.advpop{left:8px;right:8px;width:auto;bottom:88px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="devlayer"></div>
<!-- A G3 sablon: a js/minidc.js értelmezi ({{ }} értékek, sc-for, sc-if, onX események). -->

<defs>

<template id="dev-template">
<div class="{{adv.cls}} adv-fixed" onPointerEnter="{{adv.enter}}" onPointerLeave="{{adv.leave}}">
<button class="adv-char" type="button" onClick="{{adv.toggle}}" aria-expanded="{{adv.openAttr}}" aria-controls="f27-advpop" aria-label="{{adv.btnAria}}" title="Energiaőr tanácsai">
<svg viewBox="0 0 72 88" aria-hidden="true"><use href="{{adv.href}}"></use></svg>
</button>
<sc-if value="{{adv.showBubble}}"><button class="{{adv.tone}}" type="button" onClick="{{adv.toggle}}" aria-label="{{adv.aria}}"><span class="t">{{adv.text}}</span><span class="c">{{adv.count}}</span></button></sc-if>
</div>
<sc-if value="{{adv.open}}">
<aside id="f27-advpop" class="advpop" role="dialog" aria-label="Energiaőr tanácsai">
<div class="ap-head">
<svg viewBox="0 0 72 88" aria-hidden="true"><use href="{{adv.href}}"></use></svg>
<span class="ap-title">Energiaőr tanácsai</span><span class="ap-n">{{adv.n}}</span>
<button class="btn ib sm" type="button" onClick="{{adv.close}}" aria-label="Bezárás" title="Bezárás (Esc)">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#1e2a44" stroke-width="2.8" stroke-linecap="round"></path></svg>
</button>
</div>
<ol class="ap-list">
<sc-for list="{{adv.list}}" as="t"><li class="{{t.cls}}"><span class="d" aria-hidden="true"></span><span>{{t.text}}</span><sc-if value="{{t.hasDev}}"><button class="btn xs" type="button" onClick="{{t.show}}" aria-label="{{t.devAria}}">Mutasd</button></sc-if></li></sc-for>
</ol>
<div class="ap-foot">
<button class="btn xs" type="button" onClick="{{adv.toggleMute}}" aria-pressed="{{adv.mutePressed}}">{{adv.muteLabel}}</button>
<span class="ap-var" role="group" aria-label="Megjelenés (minta)">Minta: <button class="{{adv.v1Cls}}" type="button" onClick="{{adv.pickV1}}" aria-pressed="{{adv.v1Pressed}}">Robot</button><button class="{{adv.v2Cls}}" type="button" onClick="{{adv.pickV2}}" aria-pressed="{{adv.v2Pressed}}">Szakértő</button><button class="{{adv.v3Cls}}" type="button" onClick="{{adv.pickV3}}" aria-pressed="{{adv.v3Pressed}}">Szék</button></span>
</div>
</aside>
</sc-if>
<sc-if value="{{dev.open}}">
<aside id="f27-devpanel" class="devpanel" role="dialog" aria-label="Eszközök állapota">
<div class="dp-head">
<div class="dp-top">
<span class="dp-title">Eszközcsapat</span>
<span class="{{dev.srcCls}}">{{dev.srcLabel}}</span>
<button class="btn ib sm" type="button" onClick="{{ui.closeDev}}" aria-label="Bezárás" title="Bezárás (Esc)">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#1e2a44" stroke-width="2.8" stroke-linecap="round"></path></svg>
</button>
</div>
<div class="dp-xp"><span class="dp-on">{{dev.online}}/{{dev.total}} online</span><span class="bar" aria-hidden="true"><span style="width: {{dev.xpW}}"></span></span></div>
<div class="{{dev.warnCls}}">{{dev.warnText}}</div>
</div>
<div class="dp-tabs" role="tablist" aria-label="Szűrő">
<sc-for list="{{dev.tabs}}" as="t"><button class="{{t.cls}}" type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}} <span class="n">{{t.n}}</span></button></sc-for>
</div>
<div class="dp-list">
<sc-if value="{{dev.empty}}"><p class="dp-empty">Nincs ilyen eszköz. Szép munka!</p></sc-if>
<sc-for list="{{dev.cards}}" as="c">
<div class="dcwrap" data-dev="{{c.id}}">
<button class="{{c.cls}}" type="button" onClick="{{c.pick}}" aria-expanded="{{c.expandedAttr}}" aria-label="{{c.aria}}">
<span class="dc-tile" style="background: {{c.tile}}" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path d="{{c.icon}}" fill="none" stroke="#1e2a44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="pn">{{c.pinLabel}}</span></span>
<span class="dc-row"><span class="dc-name">{{c.name}}</span><span class="dc-room">{{c.room}}</span></span>
<span class="dc-row"><span class="{{c.valCls}}">{{c.value}}</span></span>
<span class="dc-row"><span class="{{c.onlineCls}}" aria-hidden="true"></span><span class="dc-seen">{{c.seen}}</span><sc-if value="{{c.hasBatt}}"><span class="hpw" title="Elem"><span class="{{c.battCls}}"><span style="width: {{c.battW}}"></span></span>{{c.batt}}</span></sc-if></span>
<sc-if value="{{c.hasBadges}}"><span class="dc-badges"><sc-for list="{{c.badges}}" as="b"><span class="bdg {{b.c}}">{{b.t}}</span></sc-for></span></sc-if>
<sc-if value="{{c.note}}"><span class="dc-note">{{c.note}}</span></sc-if>
</button>
<sc-if value="{{c.expanded}}">
<div class="dc-det"><sc-for list="{{c.details}}" as="r"><span class="k {{r.cls}}">{{r.k}}</span><span class="v">{{r.v}}</span></sc-for></div>
</sc-if>
</div>
</sc-for>
</div>
</aside>
</sc-if>
</template>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="js/minidc.js"></script>
<script src="js/g3-scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
