<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="F27 Energy Quest: a lakás izometrikus térképe, húzható bútorokkal és eszközökkel, mentett elrendezésekkel.">
<title>F27 Energy Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Baloo+2:wght@800&amp;family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
a{color:#1e2a44}a:hover{color:#ff4fa3}
.lil{font-family:"Lilita One","Baloo 2","Nunito",sans-serif;letter-spacing:.4px}
.fr{font-family:"Fraunces",Georgia,serif}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes ghost{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-8px)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
@keyframes fire{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes flick{0%,100%{opacity:1}35%{opacity:.7}60%{opacity:.95}80%{opacity:.78}}
@keyframes ring{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.7);opacity:0}}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,-50px);opacity:0}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spark{0%,100%{transform:scale(.4) rotate(0deg);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
@keyframes flag{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-7deg)}}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translate(6px,-56px) scale(1.5);opacity:0}}
@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,60,.7)}100%{box-shadow:0 0 0 12px rgba(255,90,60,0)}}
.hero{animation:hop 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.gh1{animation:ghost 3.4s ease-in-out infinite}
.gh2{animation:ghost 2.7s ease-in-out infinite .9s}
.coin{animation:spin 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fire{animation:fire .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.mk{animation:bob 3s ease-in-out infinite}
.flick{animation:flick 1.3s ease-in-out infinite}
.ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ring2{animation:ring 1.8s ease-out infinite .9s;transform-box:fill-box;transform-origin:center}
.note{animation:note 2.6s ease-out infinite}
.note2{animation:note 2.6s ease-out infinite 1.3s}
.cloud{animation:drift 24s ease-in-out infinite alternate}
.cloud2{animation:drift 31s ease-in-out infinite alternate-reverse}
.tw{animation:tw 3.4s ease-in-out infinite}
.spark{animation:spark 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flag{animation:flag 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.rise{animation:rise 4.2s ease-out infinite}
.rise2{animation:rise 5s ease-out infinite 1.6s}
.pop{animation:pop 2.4s ease-in-out infinite}
.trail{animation:dash 1.6s linear infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.root{user-select:none;-webkit-user-select:none}
.pc{cursor:grab;touch-action:none}
.pc:hover{filter:brightness(1.06) drop-shadow(0 0 3px #ffffff)}
.pc.sel{filter:drop-shadow(0 0 4px #ff4fa3) drop-shadow(0 0 2px #ff4fa3)}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 14px 6px rgba(30,42,68,.45)) brightness(1.08)}
.wall{pointer-events:none}
.panel{box-sizing:border-box;border-radius:24px;background:#fbf1dc;border:4px solid #1e2a44;box-shadow:0 6px 0 #1e2a44}
.qb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;width:100%;padding:10px 12px;border-radius:16px;border:2px solid #e3cfa6;background:#fffaf0;font-family:"Nunito",sans-serif;transition:transform .12s}
.qb:hover{transform:translateY(-1px)}
.qb:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.qb.on{border-color:#1e2a44;background:#fff1c9;box-shadow:0 3px 0 #1e2a44}
.pu{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border-radius:16px;border:3px solid #1e2a44;background:#fff7e6;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;transition:transform .12s}
.pu:hover{transform:translateY(-2px)}
.pu:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.pu.on{background:#ffe066;box-shadow:0 4px 0 #1e2a44,inset 0 0 0 3px #ff4fa3}
.lv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:8px 12px;border-radius:16px;border:3px solid #1e2a44;background:#ffffff;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;transition:transform .12s}
.lv:hover{transform:translateY(-2px)}
.lv:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.lv.on{background:#2f6fe4;color:#ffffff}
.lv.boss{background:#ffd9cc}
.lv.boss.on{background:#e8432f;color:#ffffff}
.chip{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 16px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44}
.ck{font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:#45507a}
.cv{font-family:"Lilita One","Baloo 2",sans-serif;font-size:23px;line-height:1.05;color:#1e2a44}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:3px solid #1e2a44;box-sizing:border-box}
.tag{font-size:9.5px;font-weight:900;letter-spacing:.8px;color:#ffffff;padding:2px 8px;border-radius:999px;border:2px solid #1e2a44}
.pin{all:unset;position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;cursor:grab;touch-action:none;z-index:2}
.pin:active{cursor:grabbing}
.pin.drag{z-index:5}
.pin .dot{position:absolute;inset:0;border-radius:50%;border:3px solid #1e2a44;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#ffffff;font-family:"Lilita One","Baloo 2",sans-serif;font-size:13px;box-shadow:0 3px 0 #1e2a44;transition:transform .12s}
.pin.sm .dot{font-size:11px}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.15)}
.pin:focus-visible{outline:none}
.pin:focus-visible .dot{outline:3px solid #ffffff;outline-offset:2px}
.pin.sel .dot{outline:3px solid #ffe066;outline-offset:2px}
.pin.drag .dot{transform:scale(1.2);box-shadow:0 10px 8px rgba(30,42,68,.45)}
.pin.alert .dot{animation:pulse 1.4s ease-out infinite}
.pin .val{position:absolute;left:34px;top:4px;white-space:nowrap;font-family:"Nunito",sans-serif;font-weight:900;font-size:12px;line-height:18px;padding:0 8px;border-radius:999px;border:2px solid #1e2a44;background:#ffffff;color:#1e2a44}
.pin .val.l{left:auto;right:34px}
.pin .val.hot{background:#ffd9cc}
.pin .val.bad{background:#ff5a3c;color:#ffffff}
.pin .tip{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);white-space:nowrap;font-family:"Nunito",sans-serif;font-weight:800;font-size:12px;padding:6px 10px;border-radius:12px;background:#1e2a44;color:#fff7e6;opacity:0;pointer-events:none;transition:opacity .12s}
.pin:hover .tip,.pin:focus-visible .tip{opacity:1}
.btn{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:3px solid #1e2a44;background:#ffffff;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif;font-weight:900;font-size:13px;color:#1e2a44}
.btn:hover{background:#fff1c9}
.btn:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}

/* ---- élő térkép: keret, fiók, mentés, értesítések ---- */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html,body{height:100%}
body{margin:0;background:#1e2a44;overflow:hidden;touch-action:none}
.drawer{touch-action:pan-y}
body.zoomed #stage{cursor:grab}
body.panning,body.panning #stage,body.panning *{cursor:grabbing!important}
.zoombar{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;align-items:center;gap:6px;padding:6px;border-radius:16px;background:#fffdf7;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;font-family:"Nunito",sans-serif}
.zoombar .zb{all:unset;box-sizing:border-box;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#ffffff;border:2.5px solid #1e2a44;color:#1e2a44;font:900 22px/1 "Nunito",sans-serif;cursor:pointer}
.zoombar .zb:hover{background:#ffe066}
.zoombar .zb:focus-visible{outline:3px solid #ff4fa3;outline-offset:2px}
.zoombar .zb:disabled{opacity:.35;cursor:default;background:#ffffff}
.zoombar .zl{min-width:52px;text-align:center;font:900 14px "Nunito",sans-serif;color:#1e2a44}
@media (max-width:600px){.zoombar{right:8px;bottom:8px;gap:4px;padding:4px}.zoombar .zb{width:44px;height:44px}}
#stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:#ffffff}
.btn.ib{width:44px;padding:0;justify-content:center}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:12px;box-shadow:0 3px 0 #1e2a44}
.btn.ib.sm{width:36px;padding:0}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:10px;border-width:2px;box-shadow:0 2px 0 #1e2a44}
.btn.primary{background:#ffe066}
.btn.primary:hover{background:#ffd23f}
.btn.danger{background:#ff5a3c;color:#ffffff}
.btn.danger:hover{background:#e8432f}
.btn.acct{align-self:center;min-height:40px}
.stchip{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;border:3px solid #1e2a44;background:#fff7e6;font-family:"Nunito",sans-serif;font-weight:900;font-size:12.5px;color:#1e2a44;white-space:nowrap}
.stchip:focus-visible{outline:4px solid #ff4fa3;outline-offset:3px}
.stchip .sd{width:10px;height:10px;border-radius:50%;background:#9aa3ad;border:2px solid #1e2a44}
.stchip.dirty{background:#ffe1d6}
.stchip.dirty .sd{background:#ff5a3c}
.stchip.saved .sd{background:#3fae6a}
.stchip.mini{height:28px;margin-top:6px;padding:0 10px;border-width:2px;border-radius:10px;font-size:11.5px;cursor:default}
.drawer{position:absolute;left:1144px;top:96px;width:280px;height:632px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:10;overflow-y:auto;font-family:"Nunito",sans-serif}
.drawer .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.drawer form.login{display:grid;gap:6px}
.drawer label{font-size:11px;font-weight:900;letter-spacing:.8px;color:#45507a}
.drawer input{box-sizing:border-box;width:100%;height:38px;padding:0 10px;border-radius:10px;border:2px solid #1e2a44;background:#ffffff;font:700 14px "Nunito",sans-serif;color:#1e2a44}
.drawer input:focus-visible{outline:3px solid #ff4fa3;outline-offset:1px}
.drawer form.login .btn{margin-top:6px;justify-content:center}
.drawer .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.drawer form.row input{flex:1 1 120px;width:auto;height:30px}
.drawer .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800}
.drawer .who .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .sect{margin-top:4px;font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:#45507a;border-top:2px dashed #e3cfa6;padding-top:10px}
.drawer .cur{font-size:13px;font-weight:700}
.drawer .note{margin:0;font-size:12px;font-weight:800;color:#9a3412;background:#fff1c9;border:2px solid #e3cfa6;border-radius:10px;padding:6px 8px}
.drawer .list{display:flex;flex-direction:column;gap:6px}
.drawer .lrow{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;border:2px solid #e3cfa6;background:#fffaf0}
.drawer .lrow.cur{border-color:#1e2a44;background:#fff1c9}
.drawer .lname{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;overflow:hidden}
.drawer .lname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .ltime{font-size:11px;font-weight:700;color:#45507a}
.drawer .warn{font-size:12px;font-weight:900;color:#b02a17}
.drawer .alap{margin-top:auto;font-size:12px;font-weight:800}
.toasts{position:absolute;left:470px;top:96px;width:500px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
.toast{max-width:500px;padding:10px 16px;border-radius:14px;border:3px solid #1e2a44;box-shadow:0 4px 0 #1e2a44;background:#fffdf7;font:900 13.5px "Nunito",sans-serif;color:#1e2a44;text-align:center}
.toast.ok{background:#c8f2d4}
.toast.err{background:#ffd9cc}
</style>
</head>
<body>
<div id="stage"></div>
<!-- A G3 sablon: a js/minidc.js értelmezi ({{ }} értékek, sc-for, sc-if, onX események). -->
<template id="g3-template">
<div class="root" data-root="1" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #1e2a44; background: #8fd3ff">

<svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" role="img" aria-label="A lakás izometrikus platformer pályaként. A bútorok és az eszközök húzhatók.">
<defs>
<linearGradient id="skyG2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{L.sky0}}"></stop>
<stop offset="0.55" stop-color="{{L.sky1}}"></stop>
<stop offset="1" stop-color="{{L.sky2}}"></stop>
</linearGradient>
<radialGradient id="halo2">
<stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"></stop>
<stop offset="0.4" stop-color="#ffd27a" stop-opacity="0.35"></stop>
<stop offset="1" stop-color="#ffb04f" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="warm2">
<stop offset="0" stop-color="#ffd58a" stop-opacity="0.9"></stop>
<stop offset="0.5" stop-color="#ffb35c" stop-opacity="0.3"></stop>
<stop offset="1" stop-color="#ff9a3c" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="ember2">
<stop offset="0" stop-color="#ff8a2a" stop-opacity="0.85"></stop>
<stop offset="0.5" stop-color="#ff6a1f" stop-opacity="0.28"></stop>
<stop offset="1" stop-color="#ff5a14" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="cold2">
<stop offset="0" stop-color="#bfe6ff" stop-opacity="0.85"></stop>
<stop offset="1" stop-color="#bfe6ff" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="coinG2" cx="0.35" cy="0.35">
<stop offset="0" stop-color="#fff3a6"></stop>
<stop offset="0.6" stop-color="#ffd23f"></stop>
<stop offset="1" stop-color="#e8a817"></stop>
</radialGradient>
<linearGradient id="brass2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ffe08a"></stop>
<stop offset="0.5" stop-color="#e0a93a"></stop>
<stop offset="1" stop-color="#a8741c"></stop>
</linearGradient>
<filter id="glowF2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>

<rect x="0" y="0" width="1440" height="900" fill="url(#skyG2)"></rect>
<g opacity="{{L.starOp}}">
<sc-for list="{{sc.stars}}" as="s" hint-placeholder-count="0">
<circle class="tw" cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" fill="#fff6dc" style="animation-delay: {{s.d}}"></circle>
</sc-for>
</g>
<circle cx="452" cy="{{L.sunY}}" r="80" fill="url(#halo2)" opacity="0.8"></circle>
<circle cx="452" cy="{{L.sunY}}" r="30" fill="{{L.sunC}}" stroke="#1e2a44" stroke-width="3"></circle>
<g class="cloud">
<g transform="translate(400 132) scale(.8)"><ellipse cx="0" cy="0" rx="46" ry="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><ellipse cx="-22" cy="-12" rx="24" ry="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><ellipse cx="18" cy="-16" rx="26" ry="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><rect x="-44" y="-4" width="88" height="20" fill="#ffffff" opacity="{{L.cloudOp}}"></rect></g>
</g>
<g class="cloud2">
<g transform="translate(640 120) scale(.7)"><ellipse cx="0" cy="0" rx="46" ry="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><ellipse cx="-22" cy="-12" rx="24" ry="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><ellipse cx="18" cy="-16" rx="26" ry="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3" opacity="{{L.cloudOp}}"></ellipse><rect x="-44" y="-4" width="88" height="20" fill="#ffffff" opacity="{{L.cloudOp}}"></rect></g>
</g>
<path d="{{sc.city}}" fill="{{L.city}}" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"></path>
<path d="{{sc.cityWin}}" fill="{{L.cityWin}}"></path>

<g transform="translate(720 124) scale(0.9)">
<polygon points="{{sc.road}}" fill="#5b6478" stroke="#1e2a44" stroke-width="2"></polygon>
<path d="{{sc.roadLine}}" stroke="#ffe8a8" stroke-width="2.5" stroke-dasharray="10 9" fill="none"></path>
<polygon points="{{sc.walk}}" fill="#c9c2b4" stroke="#1e2a44" stroke-width="2"></polygon>
<sc-for list="{{sc.trees}}" as="t" hint-placeholder-count="0">
<g transform="{{t.tr}}">
<line x1="0" y1="0" x2="0" y2="-40" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"></line>
<line x1="0" y1="0" x2="0" y2="-40" stroke="#8a5a3a" stroke-width="3.5" stroke-linecap="round"></line>
<circle cx="-16" cy="-52" r="20" fill="{{L.tree1}}" stroke="#1e2a44" stroke-width="3"></circle>
<circle cx="17" cy="-55" r="22" fill="{{L.tree1}}" stroke="#1e2a44" stroke-width="3"></circle>
<circle cx="0" cy="-76" r="26" fill="{{L.tree2}}" stroke="#1e2a44" stroke-width="3"></circle>
<circle cx="-7" cy="-84" r="8" fill="#ffffff" opacity="0.25"></circle>
</g>
</sc-for>
<sc-for list="{{sc.lamps}}" as="l" hint-placeholder-count="0">
<g transform="{{l.tr}}">
<line x1="0" y1="0" x2="0" y2="-92" stroke="#1e2a44" stroke-width="4"></line>
<path d="M0,-92 q0,-10 12,-10" stroke="#1e2a44" stroke-width="4" fill="none"></path>
<circle class="breathe" cx="12" cy="-98" r="34" fill="url(#halo2)" opacity="{{L.lampOp}}"></circle>
<circle cx="12" cy="-98" r="5" fill="#fff0c4" stroke="#1e2a44" stroke-width="2"></circle>
</g>
</sc-for>

<ellipse cx="-13" cy="572" rx="380" ry="54" fill="#1e2a44" opacity="0.2"></ellipse>

<sc-for list="{{sc.slab}}" as="b" hint-placeholder-count="0">
<g>
<polygon points="{{b.left}}" fill="{{b.cl}}" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"></polygon>
<polygon points="{{b.right}}" fill="{{b.cr}}" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"></polygon>
<polygon points="{{b.top}}" fill="{{b.ct}}" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"></polygon>
<path d="{{b.lines}}" stroke="{{b.lc}}" stroke-width="1.4" fill="none"></path>
</g>
</sc-for>
<sc-for list="{{sc.floors}}" as="f" hint-placeholder-count="0">
